<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Empreinte eau : footprint et fingerprint, deux regards sur l’hydrosystème</title>
<desc id="figdesc">Au-dessus d’un bassin versant avec sols, rivière et nappe, une flèche bleue relie usages et pressions aux impacts potentiels : footprint et ACV. En dessous, une flèche ocre relie les signaux observés aux sources et processus : fingerprint et eau sentinelle.</desc>
