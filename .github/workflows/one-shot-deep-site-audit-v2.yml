name: One-shot deep site audit v2
on:
  push:
    paths:
      - '.github/workflows/one-shot-deep-site-audit-v2.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deep source audit
        run: |
          set -e
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import re

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.lang=None; self.meta=[]; self.canon=[]; self.h1=0; self.img=[]; self.refs=[]; self.alt=[]; self.refresh=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='html': self.lang=a.get('lang')
                  if tag=='meta' and a.get('name')=='description': self.meta.append(a.get('content',''))
                  if tag=='meta' and a.get('http-equiv','').lower()=='refresh': self.refresh=True
                  if tag=='link' and a.get('rel')=='canonical': self.canon.append(a.get('href'))
                  if tag=='link' and a.get('rel')=='alternate' and a.get('hreflang'): self.alt.append((a.get('hreflang'),a.get('href')))
                  if tag=='h1': self.h1 += 1
                  if tag=='img': self.img.append(a)
                  for k in ('href','src'):
                      if a.get(k): self.refs.append(a[k])

          files=sorted(p for p in Path('.').rglob('*.html') if '.git' not in p.parts)
          errs=[]; warnings=[]; redirects=[]; content_pages=[]
          for p in files:
              s=p.read_text(encoding='utf-8'); q=P(); q.feed(s)
              if q.lang not in ('fr','en'): errs.append(f'{p}: invalid lang')
              if '<title>' not in s or '</title>' not in s: errs.append(f'{p}: missing title')
              if q.refresh:
                  redirects.append(str(p))
                  if len(q.canon)!=1: errs.append(f'{p}: redirect canonical count={len(q.canon)}')
                  continue
              content_pages.append(str(p))
              if len(q.meta)!=1 or not q.meta[0].strip(): errs.append(f'{p}: meta description count/content invalid')
              if len(q.canon)!=1: errs.append(f'{p}: canonical count={len(q.canon)}')
              if q.h1!=1: errs.append(f'{p}: h1 count={q.h1}')
              langs={x for x,_ in q.alt}
              if not {'fr','en','x-default'}.issubset(langs): errs.append(f'{p}: incomplete hreflang {sorted(langs)}')
              for im in q.img:
                  if not im.get('alt'): errs.append(f'{p}: img missing alt {im.get("src")}')

          # Requested recent edits and responsive layout
          req={
            'masters.html':['<h2>Anciens Masters</h2>','class="people-grid"'],
            'en/masters.html':["<h2>Former Master's students and interns</h2>",'class="people-grid"'],
            'cv.html':['Computational Methods in Water Resources, 2018–2024','Computational Methods in Water Resources 2018, Saint-Malo','co-organisateur','Thierry Labasque','Alain Rapaport'],
            'en/cv.html':['Computational Methods in Water Resources, 2018–2024','Computational Methods in Water Resources 2018, Saint-Malo','co-organizer','Thierry Labasque','Alain Rapaport'],
            'science-societe.html':['assets/maquette-nappes.jpg','assets/maquette-fractures.jpg'],
            'en/science-society.html':['../assets/maquette-nappes.jpg','../assets/maquette-fractures.jpg'],
            'galerie-recherche.html':['https://dreuzy.github.io/galerie-recherche.html'],
            'en/research-figures.html':['https://dreuzy.github.io/en/research-figures.html']}
          for f,needles in req.items():
              s=Path(f).read_text(encoding='utf-8')
              for n in needles:
                  if n not in s: errs.append(f'{f}: missing marker {n}')
          for f,h in [('masters.html','Anciens Masters'),('en/masters.html',"Former Master's students and interns")]:
              s=Path(f).read_text(encoding='utf-8'); sec=s.split(f'<h2>{h}</h2>',1)[1].split('</section>',1)[0]
              n=sec.count('<div class="people-entry">')
              if n!=27: warnings.append(f'{f}: former-master count {n}')
              if 'class="people-grid"' not in sec: errs.append(f'{f}: no people-grid')
          css=Path('styles.css').read_text(encoding='utf-8')
          if '.people-grid{display:grid;grid-template-columns:1fr 1fr' not in css: errs.append('styles.css: desktop people-grid rule missing')
          if '.people-grid{grid-template-columns:1fr}' not in css: errs.append('styles.css: responsive people-grid rule missing')

          print(f'HTML={len(files)} content={len(content_pages)} redirects={len(redirects)} FR={sum("en" not in p.parts for p in files)} EN={sum("en" in p.parts for p in files)}')
          print('Redirect pages:', ', '.join(redirects))
          for w in warnings: print('WARN',w)
          if errs:
              print('ERRORS'); print('\n'.join(errs)); raise SystemExit(1)
          print('DEEP SOURCE AUDIT PASS')
          PY
      - name: Live pages and key markers
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import time
          base='https://dreuzy.github.io/'; stamp=str(int(time.time()))
          files=sorted(p.as_posix() for p in Path('.').rglob('*.html') if '.git' not in p.parts)
          errs=[]; live={}
          for rel in files:
              try:
                  req=Request(base+rel+'?audit='+stamp,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urlopen(req,timeout=25) as r: data=r.read().decode('utf-8','replace'); code=r.status
                  if code!=200 or len(data)<80: errs.append(f'{rel}: HTTP {code} bytes={len(data)}')
                  else: live[rel]=data
              except Exception as e: errs.append(f'{rel}: {type(e).__name__}: {e}')
          for rel in ['styles.css','assets/maquette-nappes.jpg','assets/maquette-fractures.jpg']:
              try:
                  req=Request(base+rel+'?audit='+stamp,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urlopen(req,timeout=25) as r: b=r.read(); code=r.status
                  if code!=200 or not b: errs.append(f'{rel}: asset failed')
                  else: print(f'ASSET {rel}: {len(b)} bytes')
              except Exception as e: errs.append(f'{rel}: {type(e).__name__}: {e}')
          markers={
            'masters.html':['<h2>Anciens Masters</h2>','class="people-grid"'],
            'en/masters.html':["<h2>Former Master's students and interns</h2>",'class="people-grid"'],
            'cv.html':['Computational Methods in Water Resources, 2018–2024','co-organisateur'],
            'en/cv.html':['Computational Methods in Water Resources, 2018–2024','co-organizer'],
            'science-societe.html':['assets/maquette-nappes.jpg','assets/maquette-fractures.jpg'],
            'en/science-society.html':['../assets/maquette-nappes.jpg','../assets/maquette-fractures.jpg'],
            'galerie-recherche.html':['https://dreuzy.github.io/galerie-recherche.html'],
            'en/research-figures.html':['https://dreuzy.github.io/en/research-figures.html']}
          for f,needles in markers.items():
              s=live.get(f,'')
              for n in needles:
                  if n not in s: errs.append(f'{f}: live marker missing {n}')
          print(f'LIVE pages={len(live)}/{len(files)}')
          if errs:
              print('LIVE ERRORS'); print('\n'.join(errs)); raise SystemExit(2)
          print('LIVE AUDIT PASS')
          PY
      - name: External links sample audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          from urllib.request import Request,urlopen
          import concurrent.futures, ssl
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs); u=a.get('href')
                  if u and u.startswith(('http://','https://')): self.urls.append(u)
          urls=set()
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              q=P(); q.feed(p.read_text(encoding='utf-8')); urls.update(q.urls)
          # Exclude self-site; local audit already covers it.
          urls=sorted(u for u in urls if 'dreuzy.github.io' not in u)
          def check(u):
              try:
                  req=Request(u,headers={'User-Agent':'Mozilla/5.0'},method='HEAD')
                  with urlopen(req,timeout=8) as r: return u,r.status,None
              except Exception as e:
                  # Retry GET because many sites reject HEAD.
                  try:
                      req=Request(u,headers={'User-Agent':'Mozilla/5.0'})
                      with urlopen(req,timeout=10) as r: return u,r.status,None
                  except Exception as e2: return u,None,f'{type(e2).__name__}: {e2}'
          bad=[]; ok=0
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for u,status,err in ex.map(check,urls):
                  if status and status < 400: ok+=1
                  else: bad.append((u,status,err))
          print(f'EXTERNAL links unique={len(urls)} reachable={ok} unresolved={len(bad)}')
          for u,s,e in bad[:50]: print('EXTERNAL WARN',s,u,e)
          # External failures are warnings only: anti-bot/403 and transient failures are common.
          PY
