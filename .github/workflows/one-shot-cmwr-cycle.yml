name: One-shot CMWR cycle entry
on:
  push:
    paths:
      - '.github/workflows/one-shot-cmwr-cycle.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add CMWR cycle line
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Missing expected pattern in {path}: {old[:160]}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'cv.html',
              '<p><strong>Journal of Hydrology, 2016</strong> — co-éditeur, avec Timothy R. Ginn, du numéro spécial <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p><p><strong><a href="https://oseren.univ-rennes.fr/actualites/computational-methods-water-resources-cmwr" target="_blank" rel="noopener">Computational Methods in Water Resources 2018, Saint-Malo</a></strong> — co-organisateur, avec Jocelyne Erhel et Tanguy Le Borgne, de la XXIIe conférence internationale, 3–7 juin 2018.</p>',
              '<p><strong>Journal of Hydrology, 2016</strong> — co-éditeur, avec Timothy R. Ginn, du numéro spécial <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p><p><strong>Computational Methods in Water Resources, 2018–2024</strong> — membre du <em>CMWR Committee</em>, comité assurant l’organisation et la continuité du cycle international biennal de conférences.</p><p><strong><a href="https://oseren.univ-rennes.fr/actualites/computational-methods-water-resources-cmwr" target="_blank" rel="noopener">Computational Methods in Water Resources 2018, Saint-Malo</a></strong> — co-organisateur, avec Jocelyne Erhel et Tanguy Le Borgne, de la XXIIe conférence internationale, 3–7 juin 2018.</p>'
          )

          replace_once(
              'en/cv.html',
              '<p><strong>Journal of Hydrology, 2016</strong> — co-editor, with Timothy R. Ginn, of the special issue <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p><p><strong><a href="https://oseren.univ-rennes.fr/actualites/computational-methods-water-resources-cmwr" target="_blank" rel="noopener">Computational Methods in Water Resources 2018, Saint-Malo</a></strong> — co-organizer, with Jocelyne Erhel and Tanguy Le Borgne, of the 22nd international conference, 3–7 June 2018.</p>',
              '<p><strong>Journal of Hydrology, 2016</strong> — co-editor, with Timothy R. Ginn, of the special issue <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p><p><strong>Computational Methods in Water Resources, 2018–2024</strong> — member of the <em>CMWR Committee</em>, the committee ensuring the organisation and continuity of the international biennial conference series.</p><p><strong><a href="https://oseren.univ-rennes.fr/actualites/computational-methods-water-resources-cmwr" target="_blank" rel="noopener">Computational Methods in Water Resources 2018, Saint-Malo</a></strong> — co-organizer, with Jocelyne Erhel and Tanguy Le Borgne, of the 22nd international conference, 3–7 June 2018.</p>'
          )
          PY
      - name: Validate
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          grep -q 'Computational Methods in Water Resources, 2018–2024' cv.html
          grep -q 'CMWR Committee' cv.html
          grep -q 'Computational Methods in Water Resources, 2018–2024' en/cv.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv.html en/cv.html
          git commit -m 'Add CMWR conference-series role to CV'
          git push
