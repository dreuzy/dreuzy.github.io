name: One-shot add Jean de Brémond d'Ars collaboration
on:
  push:
    paths:
      - '.github/workflows/one-shot-add-jean-bremond-collab.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Add collaborator in FR and EN
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          targets = {
              'equipe.html': (
                  '<strong>Thierry Labasque</strong> · <strong>Camille Bouchez</strong>',
                  '<strong>Thierry Labasque</strong> · <strong>Jean de Brémond d\'Ars</strong> · <strong>Camille Bouchez</strong>'
              ),
              'en/team.html': (
                  '<strong>Thierry Labasque</strong> · <strong>Camille Bouchez</strong>',
                  '<strong>Thierry Labasque</strong> · <strong>Jean de Brémond d\'Ars</strong> · <strong>Camille Bouchez</strong>'
              ),
          }
          for fn, (old, new) in targets.items():
              p = Path(fn)
              s = p.read_text(encoding='utf-8')
              if "Jean de Brémond d'Ars" in s:
                  raise SystemExit(f'{fn}: collaborator already present')
              if s.count(old) != 1:
                  raise SystemExit(f'{fn}: insertion marker count={s.count(old)}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          for fn in targets:
              s = Path(fn).read_text(encoding='utf-8')
              if s.count("<strong>Jean de Brémond d'Ars</strong>") != 1:
                  raise SystemExit(f'{fn}: final collaborator count is not 1')
          print("Jean de Brémond d'Ars added to Géosciences Rennes collaborations in FR and EN.")
          PY
      - name: Validate bilingual site
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
      - name: Commit change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipe.html en/team.html
          git commit -m "Add Jean de Brémond d'Ars to current collaborators"
          git push
