name: One-shot journal counts
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-shot-journal-counts.yml]
jobs:
  extract:
    if: github.event.head_commit.message == 'Add one-shot journal counts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet beautifulsoup4
      - run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup,Tag
          import base64,gzip,re,unicodedata,json,collections
          raw=''.join(Path(f'bibliographie-payload-0{i}.txt').read_text() for i in range(1,6))
          soup=BeautifulSoup(gzip.decompress(base64.b64decode(re.sub(r'\s+','',raw))).decode(),'html.parser')
          def norm(s):
            s=unicodedata.normalize('NFD',s or ''); return ''.join(c for c in s if unicodedata.category(c)!='Mn').lower().strip()
          h=next(x for x in soup.find_all(re.compile('^h[1-6]$')) if 'articles dans des revues' in norm(x.get_text(' ',strip=True)))
          level=int(h.name[1]); state=''; entries=[]; node=h.find_next_sibling()
          while node:
            if isinstance(node,Tag) and re.match('^h[1-6]$',node.name):
              lev=int(node.name[1]);
              if lev<=level: break
              state=norm(node.get_text(' ',strip=True))
            elif isinstance(node,Tag) and 'publi' in state and node.name in ('ol','ul'):
              entries += [li.get_text(' ',strip=True) for li in node.find_all('li',recursive=False)]
            node=node.find_next_sibling()
          c=collections.Counter(); unresolved=[]
          for e in entries:
            if 'Technical note: HydroModPy' in e:
              j='Hydrology and Earth System Sciences'
            else:
              parts=e.split(' , ')
              if len(parts)>=3: j=parts[-2].strip()
              elif len(parts)==2:
                # accepted-for-publication entries
                tail=parts[-1]
                j=tail.split(',')[0].strip()
              else:
                unresolved.append(e); continue
            c[j]+=1
          print('JOURNAL_COUNTS_JSON='+json.dumps(c,ensure_ascii=False,sort_keys=True))
          print('TOTAL='+str(sum(c.values())))
          for e in unresolved: print('UNRESOLVED='+e)
          PY
