name: One-shot verify maintenance docs
on:
  push:
    paths:
      - '.github/workflows/one-shot-verify-maintenance-docs.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate site and documentation claims
        run: |
          set -euo pipefail
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          python - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET

          root=Path('.')
          readme=Path('README.md').read_text(encoding='utf-8')
          dev=Path('DEVELOPMENT.md').read_text(encoding='utf-8')
          assert '[`DEVELOPMENT.md`](DEVELOPMENT.md)' in readme

          required=[
            'mirror-map.json','styles.css','figure-loader.js','en/figure-loader.js',
            'scripts/check_bilingual_mirror.py','scripts/check_local_links.py','scripts/build_publications_over_time.py',
            'bibliography-loader.js','bibliography-updates.js','bibliography-hal.js',
            'robots.txt','sitemap.xml','.nojekyll',
            '.github/workflows/check-bilingual-mirror.yml',
            '.github/workflows/build-pyages-image.yml',
            '.github/workflows/verify-pyages-live.yml',
            '.github/workflows/update-publications-over-time.yml'
          ]
          missing=[f for f in required if not Path(f).exists()]
          assert not missing, missing

          html=sorted(p for p in root.rglob('*.html') if '.git' not in p.parts)
          assert len(html)==40, len(html)
          assert sum('en' not in p.parts for p in html)==20
          assert sum('en' in p.parts for p in html)==20

          mirror=json.loads(Path('mirror-map.json').read_text(encoding='utf-8'))
          assert len(mirror['pages'])==20, len(mirror['pages'])
          assert len(mirror['navigation'])==8, len(mirror['navigation'])

          redirects=[]; noindex=[]
          for p in html:
            s=p.read_text(encoding='utf-8')
            if re.search(r'<meta[^>]+http-equiv=["\']refresh["\']',s,re.I): redirects.append(str(p))
            if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',s,re.I): noindex.append(str(p))
          assert sorted(redirects)==['a-propos.html','en/about.html'], redirects
          assert sorted(noindex)==['en/research-figures.html','galerie-recherche.html'], noindex

          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs={e.text.strip() for e in ET.parse('sitemap.xml').findall('.//sm:loc',ns) if e.text}
          assert len(locs)==36, len(locs)
          assert 'https://dreuzy.github.io/galerie-recherche.html' not in locs
          assert 'https://dreuzy.github.io/en/research-figures.html' not in locs

          groups={}
          for p in Path('assets/figure-data').glob('*.part-*.txt'):
            m=re.match(r'(.+)\.part-(\d+)\.txt$',p.name)
            if m: groups.setdefault(m.group(1),[]).append(p)
          assert len(groups)==14, sorted(groups)

          requested={}
          for p in html:
            s=p.read_text(encoding='utf-8')
            for name,count in re.findall(r'data-b64-name=["\']([^"\']+)["\'][^>]*data-b64-parts=["\'](\d+)["\']',s):
              requested[name]=max(requested.get(name,0),int(count))
          assert len(requested)==13, requested
          assert sum(requested.values())==34, requested
          for name,count in requested.items():
            for i in range(count):
              p=Path('assets/figure-data')/f'{name}.part-{i:02d}.txt'
              assert p.exists() and p.stat().st_size>0, p
          for i in range(9):
            p=Path('assets/figure-data')/f'pyages-final-v2.part-{i:02d}.txt'
            assert p.exists() and p.stat().st_size>0, p

          payloads=sorted(root.glob('bibliographie-payload-*.txt'))
          assert len(payloads)==5 and all(p.stat().st_size>0 for p in payloads), payloads

          permanent={p.name for p in Path('.github/workflows').glob('*.yml') if not p.name.startswith('one-shot-')}
          expected={'build-pyages-image.yml','check-bilingual-mirror.yml','update-publications-over-time.yml','verify-pyages-live.yml'}
          assert permanent==expected, permanent

          for literal in ['40 fichiers HTML','20 pages FR','20 pages EN','36 pages indexables','674 références locales','14 familles `assets/figure-data`','34 fragments actifs','4 workflows GitHub Actions permanents']:
            assert literal in dev, literal

          print('Maintenance documentation matches current repository state.')
          PY
