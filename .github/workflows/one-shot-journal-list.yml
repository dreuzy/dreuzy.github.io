name: One-shot journal list extraction
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-shot-journal-list.yml]
jobs:
  extract:
    if: github.event.head_commit.message == 'Add one-shot journal list extraction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet beautifulsoup4
      - name: Extract journals
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup,Tag
          import base64,gzip,re,unicodedata,json,collections
          raw=''.join(Path(f'bibliographie-payload-0{i}.txt').read_text() for i in range(1,6))
          html=gzip.decompress(base64.b64decode(re.sub(r'\s+','',raw))).decode()
          soup=BeautifulSoup(html,'html.parser')
          def norm(s):
            s=unicodedata.normalize('NFD',s or ''); return ''.join(c for c in s if unicodedata.category(c)!='Mn').lower().strip()
          h=next(x for x in soup.find_all(re.compile('^h[1-6]$')) if 'articles dans des revues' in norm(x.get_text(' ',strip=True)))
          level=int(h.name[1]); state=''; journals=[]; node=h.find_next_sibling()
          while node:
            if isinstance(node,Tag) and re.match('^h[1-6]$',node.name):
              lev=int(node.name[1])
              if lev<=level: break
              state=norm(node.get_text(' ',strip=True))
            elif isinstance(node,Tag) and ('publi' in state or 'published' in state):
              for li in (node.find_all('li',recursive=False) if node.name in ('ol','ul') else []):
                tags=[x.get_text(' ',strip=True) for x in li.find_all(['i','em']) if x.get_text(' ',strip=True)]
                if tags: journals.append(tags[-1])
                else:
                  print('NO_ITALIC='+li.get_text(' ',strip=True))
            node=node.find_next_sibling()
          print('JOURNAL_COUNTS_JSON='+json.dumps(collections.Counter(journals),ensure_ascii=False,sort_keys=True))
          print('N_WITH_JOURNAL='+str(len(journals)))
          PY
