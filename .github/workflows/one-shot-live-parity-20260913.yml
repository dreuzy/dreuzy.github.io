name: One-shot live parity audit 2026-09-13
on:
  push:
    paths:
      - '.github/workflows/one-shot-live-parity-20260913.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare deployed static files with source
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib,time
          base='https://dreuzy.github.io/'
          files=sorted([p for p in Path('.').rglob('*.html') if '.git' not in p.parts] + [Path('styles.css'),Path('sitemap.xml'),Path('robots.txt'),Path('assets/maquette-nappes.jpg'),Path('assets/maquette-fractures.jpg')])
          stamp=str(int(time.time())); mism=[]; errs=[]
          for p in files:
              rel=p.as_posix()
              try:
                  req=Request(base+rel+'?parity='+stamp,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urlopen(req,timeout=20) as r: live=r.read(); code=r.status
                  if code!=200: errs.append((rel,code)); continue
                  src=p.read_bytes()
                  if hashlib.sha256(src).hexdigest()!=hashlib.sha256(live).hexdigest():
                      mism.append((rel,len(src),len(live)))
              except Exception as e: errs.append((rel,type(e).__name__,str(e)))
          print(f'PARITY files={len(files)} exact={len(files)-len(mism)-len(errs)} mismatches={len(mism)} errors={len(errs)}')
          for x in mism: print('MISMATCH',x)
          for x in errs: print('ERROR',x)
          if mism or errs: raise SystemExit(1)
          print('LIVE PARITY PASS')
          PY
