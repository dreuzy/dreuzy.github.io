name: One-shot fix gallery canonicals
on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-gallery-canonicals.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add canonical and language links
        run: |
          python - <<'PY'
          from pathlib import Path
          edits = {
            'galerie-recherche.html': (
              '<meta name="robots" content="noindex,follow">',
              '<meta name="robots" content="noindex,follow">\n  <link rel="canonical" href="https://dreuzy.github.io/galerie-recherche.html">\n  <link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/galerie-recherche.html">\n  <link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/research-figures.html">\n  <link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/galerie-recherche.html">'
            ),
            'en/research-figures.html': (
              '<meta name="robots" content="noindex,follow">',
              '<meta name="robots" content="noindex,follow">\n  <link rel="canonical" href="https://dreuzy.github.io/en/research-figures.html">\n  <link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/galerie-recherche.html">\n  <link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/research-figures.html">\n  <link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/galerie-recherche.html">'
            )
          }
          for path,(old,new) in edits.items():
              p=Path(path); s=p.read_text(encoding='utf-8')
              if 'rel="canonical"' in s:
                  print(path, 'already has canonical')
                  continue
              if old not in s: raise SystemExit(f'marker not found in {path}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          grep -q 'rel="canonical" href="https://dreuzy.github.io/galerie-recherche.html"' galerie-recherche.html
          grep -q 'rel="canonical" href="https://dreuzy.github.io/en/research-figures.html"' en/research-figures.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add galerie-recherche.html en/research-figures.html
          git commit -m 'Add canonical metadata to research galleries'
          git push
