name: One-shot scientific results mirror
on:
  push:
    paths:
      - '.github/workflows/one-shot-scientific-results-mirror.yml'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Wire scientific result mirrors
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          pairs = {
              'resultats-scientifiques.html': 'en/scientific-results.html',
              'resultat-rivieres-sous-sol.html': 'en/result-streams-subsurface.html',
              'resultat-temps-reactivite.html': 'en/result-transit-reactivity.html',
              'resultat-modeles-europe.html': 'en/result-models-europe.html',
              'resultat-climat-ressources.html': 'en/result-climate-water-resources.html',
              'resultat-milieux-fractures.html': 'en/result-fractured-media.html',
          }
          for fr, en in pairs.items():
              p = Path(fr)
              s = p.read_text(encoding='utf-8')
              m = re.search(r'<link rel="canonical" href="([^"]+)">', s)
              if not m:
                  raise SystemExit(f'No canonical in {fr}')
              canonical = m.group(1)
              if 'hreflang="en"' not in s:
                  alts = (
                      f'<link rel="alternate" hreflang="fr" href="{canonical}">'
                      f'<link rel="alternate" hreflang="en" href="https://dreuzy.github.io/{en}">'
                      f'<link rel="alternate" hreflang="x-default" href="{canonical}">'
                  )
                  s = s.replace(m.group(0), m.group(0) + alts, 1)
              s = s.replace(
                  '<span><strong>FR</strong> | <a href="en/research.html">EN</a></span>',
                  f'<span><strong>FR</strong> | <a href="{en}">EN</a></span>',
                  1,
              )
              p.write_text(s, encoding='utf-8')

          # English Research page: add the same deep-result pathways as in French.
          p = Path('en/research.html')
          s = p.read_text(encoding='utf-8')
          changes = [
              ('synthesis illustration inspired by Abhervé et al. (2023).</figcaption>', 'synthesis illustration inspired by Abhervé et al. (2023).</figcaption><p class="small"><strong>For further reading:</strong> <a href="result-streams-subsurface.html">what can streams tell us about the subsurface?</a></p>'),
              ('synthesis illustration inspired by Kolbe et al. (2019).</figcaption>', 'synthesis illustration inspired by Kolbe et al. (2019).</figcaption><p class="small"><strong>For further reading:</strong> <a href="result-transit-reactivity.html">why is residence time not enough to predict contaminant fate?</a></p>'),
              ('synthesis illustration inspired by Abhervé et al. (2025).</figcaption>', 'synthesis illustration inspired by Abhervé et al. (2025).</figcaption><p class="small"><strong>For further reading:</strong> <a href="result-climate-water-resources.html">how does climate change concretely transform water resources?</a></p>'),
              ('synthesis illustration of the software workflow.</figcaption>', 'synthesis illustration of the software workflow.</figcaption><p class="small"><strong>For further reading:</strong> <a href="result-models-europe.html">from catchment to Europe, which model for which question?</a></p>'),
              ('after de Dreuzy et al. (2012).</figcaption>', 'after de Dreuzy et al. (2012).</figcaption><p class="small"><strong>For further reading:</strong> <a href="result-fractured-media.html">which fracture-network properties actually control flow and transport?</a></p>'),
          ]
          for old, new in changes:
              if 'href="' + new.split('href="',1)[1].split('"',1)[0] not in s:
                  if old not in s:
                      raise SystemExit(f'Missing Research marker: {old[:60]}')
                  s = s.replace(old, new, 1)
          if 'href="scientific-results.html"' not in s:
              marker = '  <p class="discreet-gallery-link"><a href="research-figures.html">Figure gallery →</a></p>'
              block = '  <div class="deep-research-link"><div><strong>For further reading</strong><br>Selected scientific results presented through their questions, methods and contributions.</div><a href="scientific-results.html">Scientific results and contributions →</a></div>\n'
              if marker not in s:
                  raise SystemExit('Missing English gallery marker')
              s = s.replace(marker, block + marker, 1)
          p.write_text(s, encoding='utf-8')

          # Manifest: include all deep scientific pages and the gallery pair.
          mp = Path('mirror-map.json')
          data = json.loads(mp.read_text(encoding='utf-8'))
          additions = [
              ('scientific-results','resultats-scientifiques.html','en/scientific-results.html'),
              ('result-streams-subsurface','resultat-rivieres-sous-sol.html','en/result-streams-subsurface.html'),
              ('result-transit-reactivity','resultat-temps-reactivite.html','en/result-transit-reactivity.html'),
              ('result-models-europe','resultat-modeles-europe.html','en/result-models-europe.html'),
              ('result-climate-water-resources','resultat-climat-ressources.html','en/result-climate-water-resources.html'),
              ('result-fractured-media','resultat-milieux-fractures.html','en/result-fractured-media.html'),
              ('research-figures','galerie-recherche.html','en/research-figures.html'),
          ]
          ids = {item['id'] for item in data['pages']}
          pos = next(i for i,item in enumerate(data['pages']) if item['id'] == 'projects')
          for ident, fr, en in reversed(additions):
              if ident not in ids:
                  data['pages'].insert(pos, {'id': ident, 'fr': fr, 'en': en, 'navigation': True})
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Sitemap: replace FR-only result entries by bilingual pairs and add gallery.
          sp = Path('sitemap.xml')
          s = sp.read_text(encoding='utf-8')
          for fr, en in pairs.items():
              s = re.sub(r'\s*<url><loc>https://dreuzy\.github\.io/' + re.escape(fr) + r'</loc></url>', '', s)
              if f'<loc>https://dreuzy.github.io/{en}</loc>' not in s:
                  block = (
                      f'\n  <url><loc>https://dreuzy.github.io/{fr}</loc><xhtml:link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/{fr}"/><xhtml:link rel="alternate" hreflang="en" href="https://dreuzy.github.io/{en}"/><xhtml:link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/{fr}"/></url>'
                      f'\n  <url><loc>https://dreuzy.github.io/{en}</loc><xhtml:link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/{fr}"/><xhtml:link rel="alternate" hreflang="en" href="https://dreuzy.github.io/{en}"/><xhtml:link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/{fr}"/></url>\n'
                  )
                  s = s.replace('</urlset>', block + '</urlset>')
          if '<loc>https://dreuzy.github.io/galerie-recherche.html</loc>' not in s:
              block = '\n  <url><loc>https://dreuzy.github.io/galerie-recherche.html</loc><xhtml:link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/galerie-recherche.html"/><xhtml:link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/research-figures.html"/><xhtml:link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/galerie-recherche.html"/></url>\n  <url><loc>https://dreuzy.github.io/en/research-figures.html</loc><xhtml:link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/galerie-recherche.html"/><xhtml:link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/research-figures.html"/><xhtml:link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/galerie-recherche.html"/></url>\n'
              s = s.replace('</urlset>', block + '</urlset>')
          sp.write_text(s, encoding='utf-8')
          PY
      - name: Validate mirror and links
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats-scientifiques.html resultat-*.html en/research.html mirror-map.json sitemap.xml
          git commit -m 'Wire English scientific results mirror'
          git push
