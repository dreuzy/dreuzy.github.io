          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Create English scientific-result pages and wire mirrors
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT=Path('.')
          nav='''<header class="site-header"><div class="inner"><a class="brand-link" href="index.html">Jean-Raynald de Dreuzy</a><nav class="nav-links"><a href="index.html">Home</a><a class="active" href="research.html">Research</a><a href="projects.html">Projects</a><a href="team.html">Team</a><a href="publications.html">Publications</a><a href="software.html">Software</a><a href="science-society.html">Science &amp; society</a><a href="cv.html">CV</a>'''
          footer='''<footer class="preview-footer"><div class="inner">Jean-Raynald de Dreuzy · CNRS · Géosciences Rennes · ENS Rennes</div></footer>'''

          pages={
          'en/scientific-results.html': '''<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scientific results — Jean-Raynald de Dreuzy</title><meta name="description" content="Selected scientific questions, results and contributions of Jean-Raynald de Dreuzy on shallow aquifers, residence times, reactivity, upscaling, modelling and climate change.">
<link rel="canonical" href="https://dreuzy.github.io/en/scientific-results.html"><link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/resultats-scientifiques.html"><link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/scientific-results.html"><link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/resultats-scientifiques.html"><link rel="stylesheet" href="../styles.css"></head><body>
''' + nav + '''<span><a href="../resultats-scientifiques.html">FR</a> | <strong>EN</strong></span></nav></div></header>
<main class="preview-content results-index"><div class="kicker">Research · further reading</div><h1>Scientific results and contributions</h1><p class="lead">A selection of questions that have structured my research. Each entry leads to a more detailed presentation of the question, the approach, the main results and the associated contributions.</p>
<section class="section-block" aria-label="Scientific results"><div class="pub-entry"><div class="meta-line">01 · Shallow aquifers and headwater catchments</div><div class="pub-title"><a href="result-streams-subsurface.html">What can streams tell us about the subsurface?</a></div><div class="pub-meta">Using stream-network extent and intermittency to constrain the hydraulic properties of poorly observed aquifers.</div></div>
<div class="pub-entry"><div class="meta-line">02 · Residence times, water quality and reactivity</div><div class="pub-title"><a href="result-transit-reactivity.html">Why is residence time not enough to predict contaminant fate?</a></div><div class="pub-meta">Linking flow structures, time spent in the subsurface and the location of reactive zones, especially to understand denitrification.</div></div>
<div class="pub-entry"><div class="meta-line">03 · Water resources in a changing environment</div><div class="pub-title"><a href="result-climate-water-resources.html">How does climate change concretely transform water resources?</a></div><div class="pub-meta">Connecting climate projections to low flows, intermittency, storage, water supply and coastal groundwater.</div></div>
<div class="pub-entry"><div class="meta-line">04 · Modelling and upscaling</div><div class="pub-title"><a href="result-models-europe.html">From catchment to Europe: which model for which question?</a></div><div class="pub-meta">Making models comparable, reproducible and deployable, then adapting their level of fidelity to geology, data and simulation objectives.</div></div>
<div class="pub-entry"><div class="meta-line">05 · Fractured media, heterogeneity and upscaling</div><div class="pub-title"><a href="result-fractured-media.html">Which fracture-network properties actually control flow and transport?</a></div><div class="pub-meta">Distinguishing controls on mean permeability from those on channeling, transport and reactivity in strongly heterogeneous media.</div></div>
<div class="pub-entry"><div class="meta-line">06 · Current perspective</div><div class="pub-title"><a href="projects.html#onewater">How does a hydrosystem transform a pressure into a real impact?</a></div><div class="pub-meta">A question now developed within OneWater PC4, linking pressures, transfers, transformations, exposures, effects and uses.</div></div></section>
<div class="result-footer-nav"><a href="research.html">← Research</a><a href="research-figures.html">Figure gallery →</a></div></main>''' + footer + '''</body></html>''',

          'en/result-streams-subsurface.html': '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reading the subsurface from streams — Jean-Raynald de Dreuzy</title><meta name="description" content="Using stream-network extent and intermittency to constrain hydraulic properties of shallow aquifers."><link rel="canonical" href="https://dreuzy.github.io/en/result-streams-subsurface.html"><link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/resultat-rivieres-sous-sol.html"><link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/result-streams-subsurface.html"><link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/resultat-rivieres-sous-sol.html"><link rel="stylesheet" href="../styles.css"></head><body>''' + nav + '''<span><a href="../resultat-rivieres-sous-sol.html">FR</a> | <strong>EN</strong></span></nav></div></header><main class="preview-content result-page"><nav class="result-breadcrumb"><a href="research.html">Research</a><span>›</span><a href="scientific-results.html">Scientific results</a><span>›</span><span>Streams and subsurface</span></nav><div class="result-hero"><div><div class="kicker">Scientific result 01</div><h1>Reading the subsurface from streams</h1><p class="lead">The properties of a shallow aquifer are difficult to observe directly. Yet part of the information is visible at the surface: stream networks develop where the water table intersects topography. We have used this relationship as a hydrogeological calibration constraint.</p></div><aside class="result-takeaway"><strong>Key result</strong><p>Stream-network extent can become a hydrogeological observable in its own right. Across 24 headwater catchments in north-western France, the method correctly reproduces network extent in about 80% of cases.</p></aside></div>
<section class="result-section"><h2>Why the question is difficult</h2><p>Headwater catchments are numerous, small and often poorly instrumented. Hydraulic tests remain local, whereas models require effective properties at catchment scale. By contrast, stream networks and their permanence can be observed over large areas. The challenge is to determine whether this surface information can genuinely constrain subsurface functioning.</p></section>
<section class="result-figure-split"><div><h2>The principle</h2><p>The model simulates water-table position and seepage areas. The simulated network is then compared with the observed one. Calibration seeks to reduce both missing stream segments and simulated segments in excess.</p><p>This turns readily available geographical information into information on the effective hydraulic conductivity of the aquifer.</p></div><figure><a href="https://hess.copernicus.org/articles/27/3221/2023/" target="_blank" rel="noopener"><img src="https://hess.copernicus.org/articles/27/3221/2023/hess-27-3221-2023-f02-thumb.png" alt="Metrics comparing observed and simulated stream networks"></a><figcaption>Comparing observed and simulated stream networks to constrain hydraulic properties. Abhervé et al., HESS, 2023.</figcaption></figure></section>
<section class="result-section"><h2>What we learned</h2><div class="finding-grid"><article><h3>1. Low-order streams contain strong information</h3><p>Calibration is especially sensitive to the extent of small streams, precisely where surface–subsurface interactions are most direct.</p></article><article><h3>2. A mean property is not always enough</h3><p>When discharge data are added, conductivity and storage capacity can be distinguished. Two catchments with comparable conductivities can behave very differently if their effective porosities differ.</p></article><article><h3>3. Intermittency becomes a calibration observable</h3><p>At Canut and Nançon, expansion and contraction of the stream network complement discharge and help constrain model parameters with low uncertainty.</p></article></div></section>
<section class="result-figure-split reverse"><div><h2>From pilot catchments to deployment</h2><p>The aim is less to provide the local value of a property than to estimate effective properties consistent with model scale. This logic enables deployment across ensembles of catchments and feeds HydroModPy and FutureFlow.</p><p>It also requires distinguishing scales: a pumping test and an effective catchment property do not measure the same thing, even when their orders of magnitude can be compared.</p></div><figure><a href="https://hess.copernicus.org/articles/27/3221/2023/" target="_blank" rel="noopener"><img src="https://hess.copernicus.org/articles/27/3221/2023/hess-27-3221-2023-f03-thumb.png" alt="Pilot catchments in contrasting geological settings"></a><figcaption>Testing transferability across contrasting lithological settings. Abhervé et al., HESS, 2023.</figcaption></figure></section>
<section class="result-section contribution-box"><h2>Scientific contribution</h2><p>This line of work is part of a broader approach I have pursued for several years: inferring subsurface properties or structures from information available at larger scales. Here, the specific contribution has been to make the observed stream network — and then its intermittency — a quantitative constraint for calibrating shallow-aquifer models, in close collaboration with Ronan Abhervé, Alexandre Gauvain, Clément Roques, Laurent Longuevergne and Luc Aquilina.</p></section>
<section class="result-section"><h2>Publications and extensions</h2><div class="reference-list"><p><strong>Abhervé et al. (2023)</strong>, <em>Hydrology and Earth System Sciences</em> — calibration using the spatial distribution of the stream network.</p><p><strong>Abhervé et al. (2024)</strong>, <em>Hydrological Processes</em> — combining intermittency and discharge to constrain models.</p><p><strong>Extensions:</strong> <a href="software.html#hydromodpy">HydroModPy</a> · <a href="projects.html#futureflow">FutureFlow</a> · regional and pan-European characterization.</p></div></section><div class="result-footer-nav"><a href="scientific-results.html">← All results</a><a href="result-transit-reactivity.html">Next: residence times and reactivity →</a></div></main>''' + footer + '''</body></html>''',

          'en/result-transit-reactivity.html': '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Residence times and reactivity — Jean-Raynald de Dreuzy</title><meta name="description" content="From groundwater residence-time distributions to biogeochemical function: tracers, denitrification and the location of reactive zones."><link rel="canonical" href="https://dreuzy.github.io/en/result-transit-reactivity.html"><link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/resultat-temps-reactivite.html"><link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/result-transit-reactivity.html"><link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/resultat-temps-reactivite.html"><link rel="stylesheet" href="../styles.css"></head><body>''' + nav + '''<span><a href="../resultat-temps-reactivite.html">FR</a> | <strong>EN</strong></span></nav></div></header><main class="preview-content result-page"><nav class="result-breadcrumb"><a href="research.html">Research</a><span>›</span><a href="scientific-results.html">Scientific results</a><span>›</span><span>Residence times and reactivity</span></nav><div class="result-hero"><div><div class="kicker">Scientific result 02</div><h1>From residence times to biogeochemical function</h1><p class="lead">Time spent by water in the subsurface is essential, but it is not sufficient to predict contaminant fate. Our work has progressively shown that we also need to know <em>where</em> flow paths go and <em>where</em> reactive zones are located.</p></div><aside class="result-takeaway"><strong>Key result</strong><p>Two waters of the same age can undergo very different transformations. For nitrate, vertical stratification of reactivity and access to reducing horizons are decisive.</p></aside></div>
<section class="result-section"><h2>Why residence times?</h2><p>Environmental tracers connect water observed today to its recharge and circulation history. They provide access not to a single age but to a distribution of transit times, which acts as an intermediary between aquifer structure and transport or transformation processes.</p></section>
<section class="result-figure-split"><div><h2>Strongly stratified reactivity</h2><p>Work with Tamara Kolbe and project collaborators showed that denitrification capacity depends on the position of reactive zones relative to flow paths. The base of the weathered zone or layers rich in reduced minerals may concentrate most of the reactivity.</p><p>The key conceptual result is that the total amount of reactivity is not enough: its spatial location within the hydrogeological architecture controls its effectiveness at catchment scale.</p></div><figure><a href="https://www.pnas.org/doi/10.1073/pnas.1816892116" target="_blank" rel="noopener"><img src="https://www.pnas.org/cms/10.1073/pnas.1816892116/asset/1e02ddee-95be-40b1-9b46-747cbb3a00b5/assets/graphic/pnas.1816892116fig01.jpeg" alt="Conceptual framework for vertical stratification of reactivity"></a><figcaption>Vertical organization of groundwater reactivity. Kolbe et al., PNAS, 2019.</figcaption></figure></section>
<section class="result-section"><h2>Three stages in how the question evolved</h2><div class="finding-grid"><article><h3>1. Measuring transit times</h3><p>CFCs, dissolved silica and models constrain distributions of groundwater residence times in shallow aquifers.</p></article><article><h3>2. Linking transit times and reactivity</h3><p>Reaction depends on exposure time, but also on whether water actually encounters electron donors and reactive interfaces.</p></article><article><h3>3. Upscaling</h3><p>The question becomes whether geology, geomorphology, climate and land use can predict integrated retention or transformation functions across headwater catchments.</p></article></div></section>
<section class="result-figure-split reverse"><div><h2>Tracers as observers of system dynamics</h2><p>At Ploemeur, a CFC record spanning 2004–2024 shows that transit times respond very differently to changes in pumping depending on hydraulic connectivity. After pumping was reduced, median transit time increased by about +15 years at the pumping well, +10 years at F11 and +5 years at MF1, while other points changed little.</p><p>Residence time thus becomes not only a system descriptor, but also an observer of transient reorganization.</p></div><figure><a href="research-figures.html#gallery-transit"><img src="../assets/figures/gallery-ploemeur-transit-times.svg" alt="Evolution of transit times at Ploemeur"></a><figcaption>Ploemeur: age tracers reveal the reorganization of the system under pumping.</figcaption></figure></section>
<section class="result-section"><h2>Towards Aqua Incognita – Aqua Cognita</h2><p>The current extension is to use residence times and redox conditions as intermediate variables between landscape characteristics and biogeochemical functions. The ambition is no longer simply to date water, but to understand how far a hydrosystem <strong>stores, delays, transforms or transmits</strong> the pressures applied to it.</p><p>This combines process-based causal relationships with statistical relationships when the determinants are numerous or less directly observable.</p></section>
<section class="result-section contribution-box"><h2>Scientific contribution</h2><p>My contribution has been to make residence time a link between flow structure and biogeochemical functioning, and then progressively to move from the question of water age to the functional capacity of hydrosystems. This trajectory was developed with Tamara Kolbe, Camille Vautier, Jean Marçais, Sarah Leray, Luc Aquilina, Gilles Pinay, Flore Sergeant and many international collaborators.</p></section>
<section class="result-section"><h2>Publications, tools and extensions</h2><div class="reference-list"><p><strong>Kolbe et al. (2019)</strong>, <em>PNAS</em> — stratification of reactivity and nitrate removal.</p><p><strong>Gauvain et al. (2021)</strong>, <em>Water Resources Research</em> — geomorphological controls on transit times.</p><p><strong>Vautier et al. (2021)</strong>, <em>Science of the Total Environment</em> — nitrate-recovery trajectories.</p><p><strong>PyAges</strong> — a reproducible framework for comparing age distributions and uncertainty from multiple tracers.</p></div></section><div class="result-footer-nav"><a href="result-streams-subsurface.html">← Previous</a><a href="scientific-results.html">All results</a><a href="result-models-europe.html">Next: models and Europe →</a></div></main>''' + footer + '''</body></html>''',

          'en/result-models-europe.html': '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>From catchment to Europe — Jean-Raynald de Dreuzy</title><meta name="description" content="HydroModPy, FutureFlow and the shift from site-by-site groundwater models to comparable, reproducible and multi-fidelity approaches at European scale."><link rel="canonical" href="https://dreuzy.github.io/en/result-models-europe.html"><link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/resultat-modeles-europe.html"><link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/result-models-europe.html"><link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/resultat-modeles-europe.html"><link rel="stylesheet" href="../styles.css"></head><body>''' + nav + '''<span><a href="../resultat-modeles-europe.html">FR</a> | <strong>EN</strong></span></nav></div></header><main class="preview-content result-page"><nav class="result-breadcrumb"><a href="research.html">Research</a><span>›</span><a href="scientific-results.html">Scientific results</a><span>›</span><span>Models and upscaling</span></nav><div class="result-hero"><div><div class="kicker">Scientific result 03</div><h1>From catchment to Europe: which model for which question?</h1><p class="lead">The challenge is no longer only to build a good model for one site. It is to make models comparable, reproducible and deployable, and then determine which level of representation is needed for a given catchment, available data and scientific question.</p></div><aside class="result-takeaway"><strong>Central idea</strong><p>Model selection itself becomes part of modelling. There is no universally optimal level of complexity: relevance depends on context and purpose.</p></aside></div>
<section class="result-figure-split"><div><h2>HydroModPy: turning a model into a reproducible workflow</h2><p>HydroModPy organizes catchment delineation, data integration, parameterization, calibration, simulation and spatial diagnostics within a single Python environment. The issue is not only software: the goal is to make explicit and comparable steps that often depend strongly on modeller choices.</p><p>The workflow represents groundwater levels, seepage areas, cumulative fluxes, trajectories and residence times and compares several formulations on the same catchments.</p></div><figure><a href="software.html#hydromodpy"><img src="../assets/figures/hydromodpy-approved.webp" alt="HydroModPy modelling workflow"></a><figcaption>HydroModPy: from domain extraction to spatial diagnostics and residence times.</figcaption></figure></section>
<section class="result-section"><h2>Upscaling requires distinguishing properties</h2><p>Regional work on the Armorican Massif seeks to separate transferable lithological effects from variability caused by weathering, fracturing and local conditions. Rather than assigning one value to a geological unit, this leads to distributions of properties.</p><p>At European scale, work presented at EGU 2026 estimated effective transmissivity for <strong>3,333 crystalline headwater catchments</strong>. Values span several orders of magnitude and reveal regional organizations. Comparison with hydraulic tests also highlights an important limit: an effective catchment property is not equivalent to a local measurement.</p></section>
<section class="result-figure-split reverse"><div><h2>FutureFlow: multiple fidelity levels</h2><p>FutureFlow formalizes three levels of representation: parsimonious hillslope models, 3D MODFLOW-type models and integrated surface–subsurface models. Each has different computational cost, data requirements and validity domains.</p><p>The scientific question becomes: <strong>what level of fidelity is needed to reproduce the process of interest?</strong> The answer should depend on geology, topography, dominant processes, observation density and simulation objective.</p></div><figure><img src="../assets/figures/futureflow-framework.webp" alt="FutureFlow multi-model and multi-fidelity framework"><figcaption>FutureFlow multi-model and multi-fidelity framework: from parsimonious to integrated surface–subsurface models.</figcaption></figure></section>
<section class="result-section"><h2>Three scientific shifts</h2><div class="finding-grid"><article><h3>From model to comparison framework</h3><p>Models are evaluated through common processing chains with comparable data and diagnostics.</p></article><article><h3>From one value to a distribution</h3><p>Hydraulic properties are described with their variability and at the scale relevant to the model.</p></article><article><h3>From implicit to explicit choice</h3><p>Fidelity is no longer an arbitrary prerequisite; it becomes something to select and justify.</p></article></div></section>
<section class="result-section contribution-box"><h2>Scientific contribution</h2><p>My specific contribution lies at the interface between hydrogeology, scientific computing and upscaling: formalizing robust modelling workflows, comparing representation levels, and relating local properties, effective properties and domains of validity. This work is currently developed with Clément Roques, Alexandre Gauvain, Ronan Abhervé, Hélène Hivert, Alexandre Boisson, Laurent Longuevergne and partners at Inria, the University of Neuchâtel, BRGM and Géosciences Rennes.</p></section>
<section class="result-section"><h2>Projects, software and publications</h2><div class="reference-list"><p><a href="software.html#hydromodpy"><strong>HydroModPy</strong></a> — toolbox for building, calibrating, comparing and analysing shallow-aquifer models.</p><p><a href="projects.html#futureflow"><strong>ANR PRCI FutureFlow</strong></a> — multi-model and multi-fidelity approach for regional assessment of groundwater contributions to headwater catchments.</p><p><strong>Abhervé et al., EGU 2026</strong> — pan-European effective transmissivity estimates for 3,333 crystalline catchments.</p></div></section><div class="result-footer-nav"><a href="result-transit-reactivity.html">← Previous</a><a href="scientific-results.html">All results</a><a href="result-climate-water-resources.html">Next: climate and water resources →</a></div></main>''' + footer + '''</body></html>''',

          'en/result-climate-water-resources.html': '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Water resources and climate change — Jean-Raynald de Dreuzy</title><meta name="description" content="Connecting climate projections, hydrological functioning, low flows, intermittency, storage and groundwater risks to anticipate changes in water resources."><link rel="canonical" href="https://dreuzy.github.io/en/result-climate-water-resources.html"><link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/resultat-climat-ressources.html"><link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/result-climate-water-resources.html"><link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/resultat-climat-ressources.html"><link rel="stylesheet" href="../styles.css"></head><body>''' + nav + '''<span><a href="../resultat-climat-ressources.html">FR</a> | <strong>EN</strong></span></nav></div></header><main class="preview-content result-page"><nav class="result-breadcrumb"><a href="research.html">Research</a><span>›</span><a href="scientific-results.html">Scientific results</a><span>›</span><span>Climate and water resources</span></nav><div class="result-hero"><div><div class="kicker">Scientific result 04</div><h1>Water resources and climate change</h1><p class="lead">The climate signal is not directly the hydrological signal. Groundwater storage, geology, flow organization, reservoirs and water uses intervene between the two. Our work seeks to identify the hydrological variables that actually become limiting for territories.</p></div><aside class="result-takeaway"><strong>Key result</strong><p>Projections for the Rennes water-supply system show longer deficit periods, more consecutive dry years, lower reservoir refill and more constraining low flows — effects that cannot be read from precipitation changes alone.</p></aside></div>
<section class="result-section"><h2>Why use hydrological and hydrogeological models?</h2><p>Available resources depend on recharge, storage, stream support and the initial state of the system. Two climatically similar years can have different consequences if they follow different hydrological sequences. Climate projections therefore have to be translated into functioning variables: groundwater levels, streamflow, intermittency, reservoir filling and low-flow duration.</p></section>
<section class="result-figure-split"><div><h2>Water resources around Rennes: thinking in trajectories</h2><p>Models are driven by several climate projections to produce an envelope of possible futures rather than a single trajectory. The analysis focuses in particular on the duration of low-flow periods and sequences of deficit years.</p><p>The operational result is not simply “less water”: it concerns when specific functions become constrained — low-flow support, dilution of treated discharges, reservoir refill or interconnection between water-supply systems.</p></div><figure><img src="../assets/figures/eau-territoire.png" alt="Water resources and territories"><figcaption>From hydrological processes to management issues: linking recharge, storage, streamflow and uses.</figcaption></figure></section>
<section class="result-section"><h2>What the simulations highlight</h2><div class="finding-grid"><article><h3>Longer deficits</h3><p>Periods when flows fall below historical thresholds lengthen through the century in the tested scenarios.</p></article><article><h3>Multi-year memory</h3><p>Sequences of dry years become decisive because stores do not always have time to recover.</p></article><article><h3>Coupled constraints</h3><p>Reservoir filling, stream low flows, treated discharges and water availability need to be considered together rather than separately.</p></article></div></section>
<section class="result-figure-split reverse"><div><h2>The coast: another expression of the same problem</h2><p>In Normandy, climate change also raises the inverse question: not only water scarcity, but vulnerability to rising groundwater and interactions between coastal aquifers, topography and sea level.</p><p>The approach remains similar: characterize system functioning, calibrate models against observations, then identify vulnerable areas and situations. The scientific question is how the subsurface transforms a regional forcing into very local consequences.</p></div><figure><img src="../assets/figures/gallery-coastal-aquifer.svg" alt="Coastal aquifer under climate change"><figcaption>Coastal aquifers: climate and sea-level effects strongly depend on local subsurface structure and topography.</figcaption></figure></section>
<section class="result-section contribution-box"><h2>Scientific contribution</h2><p>My contribution in this area is to combine parsimonious groundwater models, field data and climate scenarios to identify variables directly related to resource functioning. The work has developed with Alexandre Gauvain, Luc Aquilina, Bastien Boivin, June Sallou, colleagues at IRISA and water-resource managers in Brittany and Normandy.</p></section>
<section class="result-section"><h2>Projects and extensions</h2><div class="reference-list"><p><strong>Chaire Eaux &amp; Territoires</strong> — connecting research on resources with real management situations.</p><p><strong>RIVAGES Normands 2100</strong> — coastal hydrogeological risks and rising groundwater.</p><p><strong>HydroModPy / FutureFlow</strong> — improving model comparability and multi-site deployment for the models underlying projections.</p></div></section><div class="result-footer-nav"><a href="result-models-europe.html">← Previous</a><a href="scientific-results.html">All results</a><a href="result-fractured-media.html">Next: fractured media →</a></div></main>''' + footer + '''</body></html>''',

          'en/result-fractured-media.html': '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fracture networks and emergent properties — Jean-Raynald de Dreuzy</title><meta name="description" content="How fracture-network geometry, connectivity and heterogeneity control permeability, channeling, transport and reactivity."><link rel="canonical" href="https://dreuzy.github.io/en/result-fractured-media.html"><link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/resultat-milieux-fractures.html"><link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/result-fractured-media.html"><link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/resultat-milieux-fractures.html"><link rel="stylesheet" href="../styles.css"></head><body>''' + nav + '''<span><a href="../resultat-milieux-fractures.html">FR</a> | <strong>EN</strong></span></nav></div></header><main class="preview-content result-page"><nav class="result-breadcrumb"><a href="research.html">Research</a><span>›</span><a href="scientific-results.html">Scientific results</a><span>›</span><span>Fractured media</span></nav><div class="result-hero"><div><div class="kicker">Scientific result 05 · mainly 2000–2015</div><h1>From fracture networks to emergent properties</h1><p class="lead">In fractured media, flow does not depend on mean permeability alone. Geometry, connectivity, shortcuts and dead ends organize preferential pathways that affect permeability, transport and reactivity in different ways.</p></div><aside class="result-takeaway"><strong>Key result</strong><p>Mean permeability can be related to a few statistical properties of the network, whereas channeling, transport and reactivity remain much more sensitive to the detailed organization of fracturing.</p></aside></div>
<section class="result-section"><h2>The upscaling problem</h2><p>Natural networks contain fractures over a wide range of scales. Explicit representation rapidly leads to millions of cells and very large ensembles of possible realizations. The challenge is both to compute robustly on complex geometries and to identify which microscopic characteristics actually control larger-scale properties.</p></section>
<section class="result-figure-split"><div><h2>Mean permeability and flow organization tell different stories</h2><p>Systematic simulations of 3D networks show that permeability is primarily related to the density of interconnected fractures and to an average of fracture permeabilities. But this statistical reduction no longer suffices for particle pathways or reactive transport.</p><p>Length distributions, connectivity, shortcuts, dead ends and aperture variations then strongly modulate channeling and transport times.</p></div><figure><a href="../assets/figures/fractured-media-channeling.png" target="_blank" rel="noopener"><img src="../assets/figures/fractured-media-channeling.png" alt="Fracture networks and flow channeling"></a><figcaption>Flow organization in heterogeneous fracture networks, based on work synthesized around de Dreuzy et al. (2012).</figcaption></figure></section>
<section class="result-section"><h2>What this work contributed</h2><div class="finding-grid"><article><h3>1. Separating mean properties from path properties</h3><p>A global property such as permeability can be summarized relatively well, whereas transport and reactivity retain strong memory of network organization.</p></article><article><h3>2. Enabling statistical 3D studies</h3><p>Numerical methods developed with Inria made it possible to simulate large ensembles of complex networks and systematically test upscaling rules.</p></article><article><h3>3. Identifying channeling as a central object</h3><p>Concentrated flows structure mixing, transit times and access to reactive surfaces. This idea later reappears in my work on shallow aquifers.</p></article></div></section>
<section class="result-section"><h2>Methodological continuity with current research</h2><p>Moving from fracture networks to catchments changes the objects but not the underlying question: <strong>which structures need to be retained to explain an emergent property?</strong> In current work, hillslope geometry, water-table position, seepage zones and reactive horizons play a role analogous to connectivity structures previously studied in fracture networks.</p><p>This continuity also explains the enduring importance of scientific computing, parsimonious models and multi-scale analysis in my research.</p></section>
<section class="result-section contribution-box"><h2>Scientific contribution</h2><p>My main contribution concerned the relationship between fracture-network geometry, hydraulic properties and transport, together with the development of numerical methods robust enough to explore large network ensembles. This work was developed with Philippe Davy, Olivier Bour, Jocelyne Erhel, Géraldine Pichot, Tanguy Le Borgne, Delphine Roubinet, Romain Le Goc, Yves Méheust and several generations of PhD students and postdoctoral researchers.</p></section>
<section class="result-section"><h2>Selected foundational publications</h2><div class="reference-list"><p><strong>de Dreuzy, Méheust &amp; Pichot (2012)</strong>, <em>Journal of Geophysical Research – Solid Earth</em> — influence of fracture-scale heterogeneity on flow properties of 3D networks.</p><p><strong>Pichot, de Dreuzy &amp; Erhel (2012)</strong>, <em>SIAM Journal on Scientific Computing</em> — simulation of 3D fracture networks using non-conforming meshes.</p><p><strong>de Dreuzy et al. (2007–2012)</strong> — transport, dispersion and mixing in strongly heterogeneous media.</p><p><a href="publications.html#pub-fractured">Key publications</a> · <a href="bibliography.html">Full bibliography</a></p></div></section><div class="result-footer-nav"><a href="result-climate-water-resources.html">← Previous</a><a href="scientific-results.html">All results</a><a href="research.html">Research →</a></div></main>''' + footer + '''</body></html>'''
          }
