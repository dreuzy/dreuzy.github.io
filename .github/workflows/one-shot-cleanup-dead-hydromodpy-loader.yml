name: One-shot cleanup dead HydroModPy loader path
on:
  push:
    paths:
      - '.github/workflows/one-shot-cleanup-dead-hydromodpy-loader.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard dead path and simplify loaders
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # No page may still request the obsolete name.
          hits=[]
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              if re.search(r'data-b64-name=["\']hydromodpy-v2["\']',s): hits.append(str(p))
          if hits: raise SystemExit(f'Guard failed: hydromodpy-v2 still requested by {hits}')

          old="""    const requestedName = img.dataset.b64Name;\n    const restoreApprovedHydroModPy = requestedName === 'hydromodpy-v2';\n    const name = restoreApprovedHydroModPy ? 'hydromodpy-approvedq100' : requestedName;\n    const count = restoreApprovedHydroModPy ? 8 : Number(img.dataset.b64Parts || 0);\n"""
          new="""    const name = img.dataset.b64Name;\n    const count = Number(img.dataset.b64Parts || 0);\n"""
          for f in ['figure-loader.js','en/figure-loader.js']:
              p=Path(f); s=p.read_text(encoding='utf-8')
              if s.count(old)!=1: raise SystemExit(f'Guard failed: expected loader block not found exactly once in {f}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Ensure the obsolete identifiers exist nowhere outside the chunks being removed and this temporary workflow.
          skip={'.github/workflows/one-shot-cleanup-dead-hydromodpy-loader.yml'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.as_posix() in skip or 'assets/figure-data' in p.as_posix() or '.git' in p.parts: continue
              try: s=p.read_text(encoding='utf-8')
              except Exception: continue
              if 'hydromodpy-v2' in s or 'hydromodpy-approvedq100' in s:
                  raise SystemExit(f'Obsolete HydroModPy identifier still referenced in {p}')

          removed=[]
          for pattern in ['hydromodpy-v2.part-*.txt','hydromodpy-approvedq100.part-*.txt']:
              for p in (Path('assets/figure-data')).glob(pattern):
                  removed.append((str(p),p.stat().st_size)); p.unlink()
          if len(removed)!=13:
              raise SystemExit(f'Guard failed: expected 13 obsolete chunk files, got {len(removed)}')
          print('Removed obsolete HydroModPy chunk files:', len(removed), 'bytes=', sum(n for _,n in removed))
          PY
      - name: Validate site and active dynamic figures
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          python - <<'PY'
          from pathlib import Path
          import re
          req={}
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              for name,count in re.findall(r'data-b64-name=["\']([^"\']+)["\'][^>]*data-b64-parts=["\'](\d+)["\']',s):
                  req[name]=max(req.get(name,0),int(count))
          for name,count in req.items():
              for i in range(count):
                  p=Path('assets/figure-data')/f'{name}.part-{i:02d}.txt'
                  assert p.exists() and p.stat().st_size>0, p
          for i in range(9):
              p=Path('assets/figure-data')/f'pyages-final-v2.part-{i:02d}.txt'
              assert p.exists() and p.stat().st_size>0, p
          print('All active dynamic figure data remain complete')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figure-loader.js en/figure-loader.js assets/figure-data
          git commit -m 'Remove dead HydroModPy figure loader path'
          git push
