name: One-shot CV and science-society refresh
on:
  push:
    paths:
      - '.github/workflows/one-shot-cv-science-refresh.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply updates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def rep(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'missing pattern: {label}')
              return s.replace(old,new,1)

          # Home FR
          p='index.html'; s=read(p)
          s=rep(s,
              'responsable du groupe interdisciplinaire RISC-E et du groupe Hydrogéologie de Géosciences Rennes (2013–2016).',
              'responsable de l’équipe EAU de Géosciences Rennes (2013–2016) et du groupe interdisciplinaire RISC-E (2014–2017).',
              'home FR responsibilities')
          write(p,s)

          # Home EN
          p='en/index.html'; s=read(p)
          s=rep(s,
              'Head of the interdisciplinary RISC-E group and of the Hydrogeology group at Géosciences Rennes (2013–2016).',
              'Head of the EAU team at Géosciences Rennes (2013–2016) and of the interdisciplinary RISC-E group (2014–2017).',
              'home EN responsibilities')
          write(p,s)

          # CV FR
          p='cv.html'; s=read(p)
          s=s.replace('collaborations internationales, projets et encadrement','collaborations scientifiques antérieures, activités éditoriales, projets et encadrement')
          s=rep(s,
              '<div class="timeline-row"><div class="timeline-year">2010–2013</div><div>Professeur invité à l’Université polytechnique de Catalogne, Espagne</div></div>',
              '<div class="timeline-row"><div class="timeline-year">2011–2013</div><div>Mobilité Marie Curie — IDAEA-CSIC / Universitat Politècnica de Catalunya, Barcelone, Espagne</div></div>',
              'CV FR Barcelona')
          start='<section class="section-block"><h2>Collaborations internationales</h2>'
          end='<section class="section-block"><h2>Formation</h2>'
          a=s.find(start); b=s.find(end)
          if a<0 or b<0 or b<=a: raise SystemExit('CV FR collaboration block not found')
          new='''<section class="section-block"><h2>Collaborations scientifiques antérieures — sélection</h2><p><strong>Philippe Davy · Olivier Bour</strong> — réseaux de fractures, percolation, hydrogéologie des milieux fracturés et changement d’échelle.</p><p><strong>Brian Berkowitz</strong> — transport dans les milieux fracturés · Institut Weizmann.</p><p><strong>Jocelyne Erhel · Géraldine Pichot</strong> — méthodes numériques, calcul scientifique et modèles de fractures · Inria.</p><p><strong>Anthony Beaudoin</strong> — dispersion et transport dans les milieux poreux hétérogènes.</p><p><strong>Jesús Carrera · Marco Dentz</strong> — transport réactif, dispersion et temps de résidence · CSIC / UPC, Barcelone.</p><p><strong>Timothy R. Ginn</strong> — âge de l’eau, distributions de temps de résidence et interprétation des traceurs.</p><p><strong>Arash Massoudieh</strong> — inversion bayésienne des traceurs environnementaux et âges des eaux souterraines.</p><p><strong>Daniel M. Tartakovsky</strong> — transport fracture–matrice et transport anormal dans les milieux fracturés.</p></section><section class="section-block"><h2>Activités éditoriales antérieures</h2><p><strong>Journal of Hydrology</strong> — éditeur associé ; activité aujourd’hui terminée.</p><p><strong>Journal of Hydrology, 2016</strong> — co-éditeur, avec Timothy R. Ginn, du numéro spécial <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p></section>'''
          s=s[:a]+new+s[b:]
          s=rep(s,
              '<section class="section-block"><h2>Formation</h2>',
              '<section class="section-block"><h2>Formation</h2><div class="timeline-row"><div class="timeline-year">2008</div><div>Habilitation à diriger des recherches (HDR) — <em>Modélisation des écoulements et du transport dans les milieux fortement hétérogènes et fracturés</em>, Université de Rennes 1</div></div>',
              'CV FR HDR')
          s=rep(s,
              '<p><strong>2013–2017</strong> — Responsable de l’équipe EAU de Géosciences Rennes et du projet interdisciplinaire RISC-E de l’OSUR.</p>',
              '<p><strong>2013–2016</strong> — Responsable de l’équipe EAU de Géosciences Rennes.</p><p><strong>2014–2017</strong> — Création et animation du groupe interdisciplinaire RISC-E de l’OSUR.</p>',
              'CV FR EAU RISC-E')
          s=s.replace('<strong>2017–2025</strong> — Rivages Normands 2100','<strong>2019–2025</strong> — Rivages Normands 2100')
          write(p,s)

          # CV EN
          p='en/cv.html'; s=read(p)
          s=s.replace('international collaborations, projects and supervision','past scientific collaborations, editorial activities, projects and supervision')
          s=s.replace('research structuring, international collaborations, projects and supervision','research structuring, past scientific collaborations, editorial activities, projects and supervision')
          s=rep(s,
              '<div class="timeline-row"><div class="timeline-year">2010–2013</div><div>Visiting Professor — Polytechnic University of Catalonia, Spain</div></div>',
              '<div class="timeline-row"><div class="timeline-year">2011–2013</div><div>Marie Curie research stay — IDAEA-CSIC / Universitat Politècnica de Catalunya, Barcelona, Spain</div></div>',
              'CV EN Barcelona')
          start='<section class="section-block"><h2>International collaborations</h2>'
          end='<section class="section-block"><h2>Education</h2>'
          a=s.find(start); b=s.find(end)
          if a<0 or b<0 or b<=a: raise SystemExit('CV EN collaboration block not found')
          new='''<section class="section-block"><h2>Past scientific collaborations — selected</h2><p><strong>Philippe Davy · Olivier Bour</strong> — fracture networks, percolation, fractured-rock hydrogeology and upscaling.</p><p><strong>Brian Berkowitz</strong> — transport in fractured media · Weizmann Institute.</p><p><strong>Jocelyne Erhel · Géraldine Pichot</strong> — numerical methods, scientific computing and fracture-network models · Inria.</p><p><strong>Anthony Beaudoin</strong> — dispersion and transport in heterogeneous porous media.</p><p><strong>Jesús Carrera · Marco Dentz</strong> — reactive transport, dispersion and residence times · CSIC / UPC, Barcelona.</p><p><strong>Timothy R. Ginn</strong> — groundwater age, residence-time distributions and tracer interpretation.</p><p><strong>Arash Massoudieh</strong> — Bayesian inversion of environmental tracers and groundwater ages.</p><p><strong>Daniel M. Tartakovsky</strong> — fracture–matrix transport and anomalous transport in fractured media.</p></section><section class="section-block"><h2>Past editorial activities</h2><p><strong>Journal of Hydrology</strong> — Associate Editor; role now completed.</p><p><strong>Journal of Hydrology, 2016</strong> — co-editor, with Timothy R. Ginn, of the special issue <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p></section>'''
          s=s[:a]+new+s[b:]
          s=rep(s,
              '<section class="section-block"><h2>Education</h2>',
              '<section class="section-block"><h2>Education</h2><div class="timeline-row"><div class="timeline-year">2008</div><div>Habilitation to supervise research (HDR) — <em>Modélisation des écoulements et du transport dans les milieux fortement hétérogènes et fracturés</em>, University of Rennes 1</div></div>',
              'CV EN HDR')
          s=rep(s,
              '<p><strong>2013–2017</strong> — Head of the EAU research team at Géosciences Rennes and of OSUR\'s interdisciplinary RISC-E project.</p>',
              '<p><strong>2013–2016</strong> — Head of the EAU research team at Géosciences Rennes.</p><p><strong>2014–2017</strong> — Creation and coordination of OSUR\'s interdisciplinary RISC-E group.</p>',
              'CV EN EAU RISC-E')
          s=s.replace('<strong>2017–2025</strong> — Rivages Normands 2100','<strong>2019–2025</strong> — Rivages Normands 2100')
          write(p,s)

          # Science & society FR: clarify recent vs earlier without creating a second page.
          p='science-societe.html'; s=read(p)
          s=rep(s,'<h2>Médias, articles et ouvrages</h2>','<h2>Médias, articles et ouvrages</h2><h3>Activités récentes</h3>','Science FR media recent')
          s=rep(s,'<div class="pub-entry"><div class="meta-line">2018 · Le Figaro</div>','<h3>Activités antérieures</h3><div class="pub-entry"><div class="meta-line">2018 · Le Figaro</div>','Science FR media earlier')
          s=rep(s,'<h2>Conférences, webinaires, débats et expertise publique</h2>','<h2>Conférences, webinaires, débats et expertise publique</h2><h3>Activités récentes</h3>','Science FR talks recent')
          s=rep(s,'<div class="pub-entry"><div class="meta-line">17 novembre 2020 · Rennes</div>','<h3>Activités antérieures</h3><div class="pub-entry"><div class="meta-line">17 novembre 2020 · Rennes</div>','Science FR talks earlier')
          s=rep(s,'<h2>Médiation scientifique et ressources pédagogiques</h2>','<h2>Médiation scientifique et ressources pédagogiques</h2><h3>Activités antérieures</h3>','Science FR outreach earlier')
          s=rep(s,'<h2>Recherche, territoires et aide à la décision</h2>','<h2>Recherche, territoires et aide à la décision</h2><h3>Activités récentes</h3>','Science FR territories recent')
          s=rep(s,'<div class="pub-entry"><div class="meta-line">2018–2020 · Région Bretagne / Agence de l’eau Loire-Bretagne</div>','<h3>Activités antérieures</h3><div class="pub-entry"><div class="meta-line">2018–2020 · Région Bretagne / Agence de l’eau Loire-Bretagne</div>','Science FR territories earlier')
          s=s.replace('<div class="meta-line">2017–2025 · Normandie</div>','<div class="meta-line">2019–2025 · Normandie</div>')
          write(p,s)

          # Science & society EN mirror.
          p='en/science-society.html'; s=read(p)
          s=rep(s,'<h2>Media, articles and books</h2>','<h2>Media, articles and books</h2>\n    <h3>Recent activities</h3>','Science EN media recent')
          s=rep(s,'<div class="pub-entry"><div class="meta-line">2018 · Le Figaro</div>','<h3>Earlier activities</h3>\n    <div class="pub-entry"><div class="meta-line">2018 · Le Figaro</div>','Science EN media earlier')
          s=rep(s,'<h2>Public talks, webinars, debates and public expertise</h2>','<h2>Public talks, webinars, debates and public expertise</h2>\n    <h3>Recent activities</h3>','Science EN talks recent')
          s=rep(s,'<div class="pub-entry"><div class="meta-line">17 November 2020 · Rennes</div>','<h3>Earlier activities</h3>\n    <div class="pub-entry"><div class="meta-line">17 November 2020 · Rennes</div>','Science EN talks earlier')
          s=rep(s,'<h2>Science outreach and educational resources</h2>','<h2>Science outreach and educational resources</h2>\n    <h3>Earlier activities</h3>','Science EN outreach earlier')
          s=rep(s,'<h2>Research, territories and decision support</h2>','<h2>Research, territories and decision support</h2>\n    <h3>Recent activities</h3>','Science EN territories recent')
          s=rep(s,'<div class="pub-entry"><div class="meta-line">2018–2020 · Brittany Region / Loire-Bretagne Water Agency</div>','<h3>Earlier activities</h3>\n    <div class="pub-entry"><div class="meta-line">2018–2020 · Brittany Region / Loire-Bretagne Water Agency</div>','Science EN territories earlier')
          s=s.replace('<div class="meta-line">2017–2025 · Normandy</div>','<div class="meta-line">2019–2025 · Normandy</div>')
          write(p,s)

          # Sitemap: add publications-over-time pair if missing.
          p='sitemap.xml'; s=read(p)
          if 'publications-au-fil-du-temps.html' not in s:
              block='''\n  <url><loc>https://dreuzy.github.io/publications-au-fil-du-temps.html</loc><xhtml:link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/publications-au-fil-du-temps.html"/><xhtml:link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/publications-over-time.html"/><xhtml:link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/publications-au-fil-du-temps.html"/></url>\n  <url><loc>https://dreuzy.github.io/en/publications-over-time.html</loc><xhtml:link rel="alternate" hreflang="fr" href="https://dreuzy.github.io/publications-au-fil-du-temps.html"/><xhtml:link rel="alternate" hreflang="en" href="https://dreuzy.github.io/en/publications-over-time.html"/><xhtml:link rel="alternate" hreflang="x-default" href="https://dreuzy.github.io/publications-au-fil-du-temps.html"/></url>\n'''
              s=s.replace('</urlset>',block+'</urlset>')
              write(p,s)
          PY
      - name: Validate local links
        run: python scripts/check_local_links.py
      - name: Validate current bilingual mirror
        run: python scripts/check_bilingual_mirror.py
      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html cv.html en/cv.html science-societe.html en/science-society.html sitemap.xml
          git commit -m 'Refresh CV and science-society structure'
          git push
