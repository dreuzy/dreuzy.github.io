name: Rebuild CV PDF (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-cv-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Rebuild PDF from its source
        run: python scripts/build_cv_pdf.py
      - name: Commit updated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cv/CV_Jean-Raynald_de_Dreuzy_2026.pdf
          if git diff --cached --quiet; then
            echo 'PDF unchanged'
            exit 0
          fi
          git commit -m 'Rebuild PDF CV with updated IRIS-E responsibility and bibliography count'
          git pull --rebase
          git push
