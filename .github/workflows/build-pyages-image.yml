name: Build PyAges image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-pyages-image.yml"
      - "assets/figure-data/pyages-final-v2.part-*.txt"
      - "assets/figure-data/manifest.json"
      - "scripts/materialize_figure_assets.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pyages-image-main
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild and verify PyAges image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild image from verified chunks
        run: python scripts/materialize_figure_assets.py --name pyages-final-v2

      - name: Commit verified image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pyages-groundwater-age-v2.webp
          if git diff --cached --quiet; then
            echo "Verified image already up to date."
            exit 0
          fi
          git commit -m "Build verified PyAges image asset"
          git pull --rebase
          git push
