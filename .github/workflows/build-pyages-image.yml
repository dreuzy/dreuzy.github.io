name: Build PyAges image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-pyages-image.yml"
      - "assets/figure-data/pyages-final-v2.part-*.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Rebuild and verify PyAges image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild image from verified chunks
        shell: bash
        run: |
          set -euo pipefail
          cat assets/figure-data/pyages-final-v2.part-{00..08}.txt | tr -d '\r\n' | base64 --decode > assets/pyages-groundwater-age-v2.webp
          test "$(stat -c%s assets/pyages-groundwater-age-v2.webp)" = "58538"
          echo "54bbf9d165c92d15f6fe890ac6aecea2eff65dfc467b0e5b7e51326602745b50  assets/pyages-groundwater-age-v2.webp" | sha256sum --check --strict
          file assets/pyages-groundwater-age-v2.webp

      - name: Commit verified image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pyages-groundwater-age-v2.webp
          if git diff --cached --quiet; then
            echo "Verified image already up to date."
            exit 0
          fi
          git commit -m "Build verified PyAges image asset"
          git push
