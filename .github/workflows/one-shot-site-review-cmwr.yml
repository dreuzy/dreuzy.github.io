name: One-shot site review and CMWR wording fix
on:
  push:
    paths:
      - '.github/workflows/one-shot-site-review-cmwr.yml'
permissions:
  contents: write
jobs:
  review-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply requested wording and collaboration updates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Missing expected pattern in {path}: {old[:160]}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # French CV: spell out CMWR and use co-organisateur.
          replace_once(
              'cv.html',
              '<p><strong><a href="https://oseren.univ-rennes.fr/actualites/computational-methods-water-resources-cmwr" target="_blank" rel="noopener">CMWR 2018, Saint-Malo</a></strong> — co-président, avec Jocelyne Erhel et Tanguy Le Borgne, de la XXIIe conférence <em>Computational Methods in Water Resources</em>, 3–7 juin 2018.</p>',
              '<p><strong><a href="https://oseren.univ-rennes.fr/actualites/computational-methods-water-resources-cmwr" target="_blank" rel="noopener">Computational Methods in Water Resources 2018, Saint-Malo</a></strong> — co-organisateur, avec Jocelyne Erhel et Tanguy Le Borgne, de la XXIIe conférence internationale, 3–7 juin 2018.</p>'
          )

          # Add Thierry Labasque to past scientific collaborations if not already present.
          p = Path('cv.html')
          s = p.read_text(encoding='utf-8')
          if '<strong>Thierry Labasque</strong>' not in s:
              old = '<strong>Alain Rapaport</strong> (MISTEA, INRAE — modélisation mathématique, transport réactif et processus microbiens), <strong>Jacques Bodin</strong>'
              new = '<strong>Alain Rapaport</strong> (MISTEA, INRAE — modélisation mathématique, transport réactif et processus microbiens), <strong>Thierry Labasque</strong> (Géosciences Rennes, Université de Rennes — traceurs environnementaux, temps de résidence et hydrogéologie), <strong>Jacques Bodin</strong>'
              if old not in s:
                  raise SystemExit('Could not locate insertion point for Thierry Labasque in cv.html')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # English mirror.
          replace_once(
              'en/cv.html',
              '<p><strong><a href="https://oseren.univ-rennes.fr/actualites/computational-methods-water-resources-cmwr" target="_blank" rel="noopener">CMWR 2018, Saint-Malo</a></strong> — conference co-chair, with Jocelyne Erhel and Tanguy Le Borgne, for the 22nd <em>Computational Methods in Water Resources</em> conference, 3–7 June 2018.</p>',
              '<p><strong><a href="https://oseren.univ-rennes.fr/actualites/computational-methods-water-resources-cmwr" target="_blank" rel="noopener">Computational Methods in Water Resources 2018, Saint-Malo</a></strong> — co-organizer, with Jocelyne Erhel and Tanguy Le Borgne, of the 22nd international conference, 3–7 June 2018.</p>'
          )

          p = Path('en/cv.html')
          s = p.read_text(encoding='utf-8')
          if '<strong>Thierry Labasque</strong>' not in s:
              old = '<strong>Alain Rapaport</strong> (MISTEA, INRAE — mathematical modelling, reactive transport and microbial processes), <strong>Jacques Bodin</strong>'
              new = '<strong>Alain Rapaport</strong> (MISTEA, INRAE — mathematical modelling, reactive transport and microbial processes), <strong>Thierry Labasque</strong> (Géosciences Rennes, University of Rennes — environmental tracers, residence times and hydrogeology), <strong>Jacques Bodin</strong>'
              if old not in s:
                  raise SystemExit('Could not locate insertion point for Thierry Labasque in en/cv.html')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify requested content and illustrations
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = {
              'cv.html': [
                  'Computational Methods in Water Resources 2018, Saint-Malo',
                  'co-organisateur',
                  '<strong>Thierry Labasque</strong>',
                  '<strong>Alain Rapaport</strong>',
                  'Principales activités éditoriales et d’animation scientifique',
              ],
              'en/cv.html': [
                  'Computational Methods in Water Resources 2018, Saint-Malo',
                  'co-organizer',
                  '<strong>Thierry Labasque</strong>',
                  '<strong>Alain Rapaport</strong>',
                  'Selected editorial and scientific-community activities',
              ],
              'science-societe.html': [
                  'assets/maquette-nappes.jpg',
                  'assets/maquette-fractures.jpg',
              ],
              'en/science-society.html': [
                  '../assets/maquette-nappes.jpg',
                  '../assets/maquette-fractures.jpg',
              ],
              'equipe.html': ['<strong>Thierry Labasque</strong>'],
              'en/team.html': ['<strong>Thierry Labasque</strong>'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'Missing required content in {path}: {needle}')

          for asset in ['assets/maquette-nappes.jpg', 'assets/maquette-fractures.jpg']:
              if not Path(asset).is_file() or Path(asset).stat().st_size == 0:
                  raise SystemExit(f'Missing or empty image asset: {asset}')

          # No abbreviated visible CMWR title or old role should remain in CV pages.
          for path in ['cv.html', 'en/cv.html']:
              text = Path(path).read_text(encoding='utf-8')
              forbidden = ['>CMWR 2018, Saint-Malo<', 'co-président', 'conference co-chair']
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f'Obsolete wording remains in {path}: {token}')
          PY
      - name: Validate bilingual structure and local links across the site
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
      - name: Additional whole-site HTML sanity check
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs=[]
                  self.title_count=0
                  self.html_lang=None
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='html':
                      self.html_lang=a.get('lang')
                  if tag=='title':
                      self.title_count += 1
                  for key in ('href','src'):
                      if key in a and a[key]:
                          self.refs.append(a[key])

          html_files=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts]
          if not html_files:
              raise SystemExit('No HTML files found')
          errors=[]
          for p in html_files:
              text=p.read_text(encoding='utf-8')
              parser=Parser(); parser.feed(text)
              if '<title>' not in text or '</title>' not in text:
                  errors.append(f'{p}: missing title')
              if parser.html_lang not in ('fr','en'):
                  errors.append(f'{p}: missing/invalid html lang')
              for ref in parser.refs:
                  if ref.startswith(('#','mailto:','tel:','data:','javascript:')):
                      continue
                  u=urlparse(ref)
                  if u.scheme in ('http','https') or ref.startswith('//'):
                      continue
                  target=(p.parent / u.path).resolve()
                  if u.path and not target.exists():
                      errors.append(f'{p}: missing local target {ref}')
          if errors:
              raise SystemExit('\n'.join(errors[:100]))
          print(f'Checked {len(html_files)} HTML files: basic structure and local targets OK')
          PY
      - name: Commit reviewed changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv.html en/cv.html
          if git diff --cached --quiet; then
            echo 'No content changes needed.'
          else
            git commit -m 'Spell out CMWR and refine collaboration entry'
            git push
          fi
