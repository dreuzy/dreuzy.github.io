name: One-shot content and bibliometrics pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-content-bibliometrics.yml

permissions:
  contents: write

jobs:
  update-and-analyse:
    if: github.event.head_commit.message == 'Add one-shot content and bibliometrics pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply requested website corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, replacements):
              p=Path(path); s=p.read_text(encoding='utf-8'); old_s=s
              for old,new in replacements:
                  if old not in s:
                      raise SystemExit(f'Expected text not found in {path}: {old[:120]}')
                  s=s.replace(old,new)
              if s != old_s:
                  p.write_text(s, encoding='utf-8')

          replace_exact('equipe.html', [
            ('<strong>Alexandre Boisson</strong> (BRGM)', '<strong>Alexandre Boisson</strong> · <strong>Anne Togola</strong> (BRGM)'),
            ('<strong>Jean Marçais</strong> (RiverLy, INRAE)', '<strong>Jean Marçais</strong> · <strong>Arnaud Chaumot</strong> · <strong>Florentina Moatar</strong> (RiverLy, INRAE)'),
            ('<strong>Sarah Leray</strong> (HydroSciences Montpellier, CNRS / Université de Montpellier)', '<strong>Sarah Leray</strong> · <strong>Hélène Fenet</strong> (HydroSciences Montpellier, CNRS / Université de Montpellier)'),
            ('<div class="topic">Modélisation hydrologique, reproductibilité et développement logiciel ; préparation de l’intégration des développements dans HydroModPy / AquiFR.</div>', '<div class="position">Modélisation hydrologique, reproductibilité et développement logiciel ; préparation de l’intégration des développements dans HydroModPy / AquiFR.</div>'),
          ])
          replace_exact('en/team.html', [
            ('<strong>Alexandre Boisson</strong> (BRGM)', '<strong>Alexandre Boisson</strong> · <strong>Anne Togola</strong> (BRGM)'),
            ('<strong>Jean Marçais</strong> (RiverLy, INRAE)', '<strong>Jean Marçais</strong> · <strong>Arnaud Chaumot</strong> · <strong>Florentina Moatar</strong> (RiverLy, INRAE)'),
            ('<strong>Sarah Leray</strong> (HydroSciences Montpellier, CNRS / University of Montpellier)', '<strong>Sarah Leray</strong> · <strong>Hélène Fenet</strong> (HydroSciences Montpellier, CNRS / University of Montpellier)'),
            ('<div class="topic">Hydrological modelling, reproducibility and software development; preparation for integration into HydroModPy / AquiFR.</div>', '<div class="position">Hydrological modelling, reproducibility and software development; preparation for integration into HydroModPy / AquiFR.</div>'),
          ])

          old_head = '<div class="pub-entry"><div class="pub-title">From Aqua Incognita to Aqua Cognita</div><div class="pub-meta">F. Sergeant, J.-R. de Dreuzy, S. Bernal, M. Ross &amp; G. Pinay (2026) · soumis à <span class="smallcaps">Hydrological Processes</span></div></div>'
          new_head = '<div class="pub-entry"><div class="pub-title">Headwater catchments: from aqua incognita to aqua cognita</div><div class="pub-meta">F. Sergeant, J.-R. de Dreuzy, S. Bernal, M. Ross &amp; G. Pinay (2026) · soumis à <span class="smallcaps">Hydrological Processes</span></div></div>'
          tech = '<div class="pub-entry"><div class="pub-title"><a href="https://hess.copernicus.org/articles/30/5571/2026/">Technical note: HydroModPy (v1.0) – a Python toolbox for deploying catchment-scale shallow groundwater models</a></div><div class="pub-meta">A. Gauvain et al. (2026) · <span class="smallcaps">Hydrology and Earth System Sciences</span>, 30, 5571</div></div>'
          p=Path('publications.html'); s=p.read_text(encoding='utf-8')
          if old_head not in s or tech not in s: raise SystemExit('Expected FR publication entries not found')
          s=s.replace(old_head,'').replace(tech, new_head+'\n    '+tech,1).replace('PyAge: an extensible toolkit for lumped-parameter modeling of tracer-derived groundwater ages','PyAges: an extensible toolkit for lumped-parameter modeling of tracer-derived groundwater ages')
          p.write_text(s,encoding='utf-8')

          old_head_en = '<div class="pub-entry"><div class="pub-title">From Aqua Incognita to Aqua Cognita</div><div class="pub-meta">F. Sergeant, J.-R. de Dreuzy, S. Bernal, M. Ross &amp; G. Pinay (2026) · submitted to <span class="smallcaps">Hydrological Processes</span></div></div>'
          new_head_en = '<div class="pub-entry"><div class="pub-title">Headwater catchments: from aqua incognita to aqua cognita</div><div class="pub-meta">F. Sergeant, J.-R. de Dreuzy, S. Bernal, M. Ross &amp; G. Pinay (2026) · submitted to <span class="smallcaps">Hydrological Processes</span></div></div>'
          tech_en = '<div class="pub-entry"><div class="pub-title"><a href="https://hess.copernicus.org/articles/30/5571/2026/">Technical note: HydroModPy (v1.0) – a Python toolbox for deploying catchment-scale shallow groundwater models</a></div><div class="pub-meta">A. Gauvain et al. (2026) · <span class="smallcaps">Hydrology and Earth System Sciences</span>, 30, 5571</div></div>'
          p=Path('en/publications.html'); s=p.read_text(encoding='utf-8')
          if old_head_en not in s or tech_en not in s: raise SystemExit('Expected EN publication entries not found')
          s=s.replace(old_head_en,'').replace(tech_en,new_head_en+'\n    '+tech_en,1).replace('PyAge: an extensible toolkit for lumped-parameter modeling of tracer-derived groundwater ages','PyAges: an extensible toolkit for lumped-parameter modeling of tracer-derived groundwater ages')
          p.write_text(s,encoding='utf-8')

          # Keep the dynamically rendered complete bibliography consistent with the selected publications.
          p=Path('bibliography-loader.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("pyage: an extensible toolkit for lumped-parameter modeling of tracer-derived groundwater ages", "pyages: an extensible toolkit for lumped-parameter modeling of tracer-derived groundwater ages")
          s=s.replace("PyAge: an extensible toolkit for lumped-parameter modeling of tracer-derived groundwater ages", "PyAges: an extensible toolkit for lumped-parameter modeling of tracer-derived groundwater ages")
          marker="host.innerHTML = await new Response(stream).text();"
          if marker not in s: raise SystemExit('Bibliography loader marker missing')
          patch = marker + "\n\n      host.querySelectorAll('li,p').forEach(entry => {\n        entry.innerHTML = entry.innerHTML\n          .replaceAll('From Aqua Incognita to Aqua Cognita', 'Headwater catchments: from aqua incognita to aqua cognita')\n          .replaceAll('PyAge: an extensible toolkit for lumped-parameter modeling of tracer-derived groundwater ages', 'PyAges: an extensible toolkit for lumped-parameter modeling of tracer-derived groundwater ages');\n      });"
          if "Headwater catchments: from aqua incognita to aqua cognita')" not in s:
              s=s.replace(marker,patch,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate site
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
      - name: Commit website corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipe.html en/team.html publications.html en/publications.html bibliography-loader.js
          git commit -m 'Refine collaborations and publication metadata'
          git push
      - name: Decode bibliography and report annual counts
        run: |
          python -m pip install --quiet beautifulsoup4
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, Tag
          import base64,gzip,re,json,unicodedata
          raw=''.join(Path(f'bibliographie-payload-0{i}.txt').read_text() for i in range(1,6))
          html=gzip.decompress(base64.b64decode(re.sub(r'\s+','',raw))).decode('utf-8')
          soup=BeautifulSoup(html,'html.parser')
          def norm(s):
              s=unicodedata.normalize('NFD',s or '')
              s=''.join(c for c in s if unicodedata.category(c)!='Mn')
              return re.sub(r'\s+',' ',s).strip().lower()
          headings=[(h.name,h.get_text(' ',strip=True)) for h in soup.find_all(re.compile('^h[1-6]$'))]
          print('HEADINGS_JSON='+json.dumps(headings,ensure_ascii=False))
          def section_entries(keyword, published_only=False):
              h=None
              for x in soup.find_all(re.compile('^h[1-6]$')):
                  if keyword in norm(x.get_text(' ',strip=True)):
                      h=x; break
              if not h: raise SystemExit('Section not found: '+keyword)
              level=int(h.name[1]); out=[]; state=''
              node=h.find_next_sibling()
              while node:
                  if isinstance(node,Tag) and re.match('^h[1-6]$',node.name):
                      lev=int(node.name[1])
                      if lev<=level: break
                      state=norm(node.get_text(' ',strip=True))
                  elif isinstance(node,Tag):
                      for li in (node.find_all('li',recursive=False) if node.name in ('ol','ul') else []):
                          text=li.get_text(' ',strip=True)
                          if not published_only or ('publi' in state or 'published' in state): out.append(text)
                  node=node.find_next_sibling()
              return out
          articles=section_entries('articles dans des revues a comite de lecture', published_only=True)
          abstracts=section_entries('abstracts de colloques', published_only=False)
          # The live bibliography adds two 2026 published records dynamically that are not in the compressed payload.
          extras=[
            'A. Gauvain et al. (2026), Technical note: HydroModPy (v1.0) – a Python toolbox for deploying catchment-scale shallow groundwater models. Hydrology and Earth System Sciences, 30, 5571.',
            'RIVAGES Normands 2100 (2026), Rivages Normands 2100: transdisciplinary co-constructed knowledge for land-use adaptation to groundwater rise along Normandy coastline. Sustainability Science.'
          ]
          titles=norm(' '.join(articles))
          for e in extras:
              key='technical note: hydromodpy' if 'HydroModPy' in e else 'rivages normands 2100: transdisciplinary'
              if key not in titles: articles.append(e)
          def counts(entries):
              d={}
              for e in entries:
                  m=re.search(r'\((19\d{2}|20\d{2})\)',e)
                  if not m: m=re.search(r'\b(19\d{2}|20\d{2})\b',e)
                  if m: d[int(m.group(1))]=d.get(int(m.group(1)),0)+1
              return dict(sorted(d.items()))
          print('ARTICLE_COUNTS_JSON='+json.dumps(counts(articles),sort_keys=True))
          print('ABSTRACT_COUNTS_JSON='+json.dumps(counts(abstracts),sort_keys=True))
          print('ARTICLE_ENTRIES_JSON='+json.dumps(articles,ensure_ascii=False))
          print('ABSTRACT_TOTAL='+str(len(abstracts)))
          print('ARTICLE_TOTAL='+str(len(articles)))
          PY
