name: One-shot classify bibliography audit candidates
on:
  push:
    paths:
      - '.github/workflows/one-shot-audit-bibliography-classification.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet beautifulsoup4 requests
      - name: Classify serious external candidates against full bibliography
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, Tag
          import base64,gzip,re,unicodedata,json,requests
          from difflib import SequenceMatcher

          candidates=[
            ('Convergence analysis of macrospreading in 3D heterogeneous porous media','10.1051/proc/201341003'),
            ('Flow in multiscale fractal fracture networks','10.1144/gsl.sp.2006.261.01.03'),
            ('Towards a Robust and Flexible Numerical Framework for Integrated Urban Water System Modeling','10.1016/j.proeng.2016.07.580'),
            ("Aqui-FR, un système multi-modèle hydrogéologique à l'échelle nationale",''),
            ('Modélisation hydrogéologique : Des pollutions suivies à la trace',''),
            ('Des pollutions suivies à la trace',''),
            ('Mieux gérer les ressources naturelles',''),
            ('A modified Lagrangian-volumes method to simulate chemical transport in heterogeneous porous media',''),
            ('Non-Fickian mixing in heterogeneous porous media',''),
            ('Scaling of mixing and spreading in heterogeneous porous media (Invited)',''),
            ('Flow model relevant to fractured crystalline aquifers : insights from a scaling interpretation of pumping tests.',''),
            ('Diffusion Within the Matrix in Heterogeneous Fracture Media',''),
            ('A Groundwater Database for site and process studies in heterogeneous aquifers',''),
            ('Influence of correlation on the permeability and on well-test interpretation of two-dimensional fractal porous and fractured media',''),
            ('Permeability of 2D Multiscale Fracture Networks',''),
            ('Double peak formation in reactive solute transport',''),
            ('A simplified fracture network model for studying the efficiency of a single well semi open loop heat exchanger in fractured crystalline rock',''),
          ]
          def norm(s):
            s=unicodedata.normalize('NFKD',s or '')
            s=''.join(c for c in s if not unicodedata.combining(c)).lower()
            s=re.sub(r'[^a-z0-9]+',' ',s)
            return re.sub(r'\s+',' ',s).strip()
          def sim(a,b):
            a,b=norm(a),norm(b)
            if a==b:return 1
            if min(len(a),len(b))>25 and (a in b or b in a):return .97
            return SequenceMatcher(None,a,b).ratio()

          payloads=[Path(f'bibliographie-payload-0{i}.txt') for i in range(1,6)]
          raw=gzip.decompress(base64.b64decode(re.sub(r'\s+','',''.join(p.read_text() for p in payloads)))).decode('utf-8')
          soup=BeautifulSoup(raw,'html.parser')
          entries=[]
          for el in soup.find_all(['li','p']):
            txt=el.get_text(' ',strip=True)
            if not txt:continue
            hs=[]
            h=el.find_previous(re.compile(r'^h[1-6]$'))
            # nearest and parent-level headings
            if h:
              hs.append(h.get_text(' ',strip=True))
              lv=int(h.name[1]); p=h.find_previous(re.compile(r'^h[1-6]$'))
              while p:
                if int(p.name[1])<lv:
                  hs.append(p.get_text(' ',strip=True)); lv=int(p.name[1])
                p=p.find_previous(re.compile(r'^h[1-6]$'))
            entries.append((txt,' > '.join(reversed(hs))))

          S=requests.Session(); S.headers['User-Agent']='dreuzy-bib-audit/1.0'
          for title,doi in candidates:
            best=max(((sim(title,t),t,sec) for t,sec in entries),key=lambda z:z[0])
            meta={}
            if doi:
              try:
                r=S.get('https://api.crossref.org/works/'+doi,timeout=20)
                if r.ok:
                  m=r.json()['message']; meta={'crossref_type':m.get('type'),'container':(m.get('container-title') or [''])[0],'publisher':m.get('publisher',''),'published':((m.get('published') or {}).get('date-parts') or [[None]])[0][0]}
              except Exception as e: meta={'crossref_error':str(e)}
            print(json.dumps({'candidate':title,'doi':doi,'best_score':round(best[0],3),'best_entry':best[1],'section':best[2],**meta},ensure_ascii=False))
          PY
