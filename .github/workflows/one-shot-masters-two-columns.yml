name: One-shot masters two-column layout
on:
  push:
    paths:
      - '.github/workflows/one-shot-masters-two-columns.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply two-column layout to former masters
        run: |
          python - <<'PY'
          from pathlib import Path

          def transform(path, heading):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              marker = f'  <section class="section-block">\n    <h2>{heading}</h2>\n'
              if marker not in s:
                  raise SystemExit(f'Missing section marker in {path}: {heading}')
              before, rest = s.split(marker, 1)
              body, after = rest.split('  </section>', 1)
              if 'class="people-grid"' in body:
                  print(f'{path}: already two columns')
                  return
              lines = [line for line in body.splitlines() if line.strip()]
              entries = [line for line in lines if '<div class="people-entry">' in line]
              if len(entries) != len(lines) or len(entries) < 2:
                  raise SystemExit(f'Unexpected former-master section structure in {path}: {len(entries)} entries / {len(lines)} lines')
              mid = (len(entries) + 1) // 2
              left = '\n'.join('        ' + e.strip() for e in entries[:mid])
              right = '\n'.join('        ' + e.strip() for e in entries[mid:])
              new_body = (
                  '    <div class="people-grid">\n'
                  '      <div>\n' + left + '\n'
                  '      </div>\n'
                  '      <div>\n' + right + '\n'
                  '      </div>\n'
                  '    </div>\n'
              )
              p.write_text(before + marker + new_body + '  </section>' + after, encoding='utf-8')
              print(f'{path}: {len(entries)} entries split {mid}/{len(entries)-mid}')

          transform('masters.html', 'Anciens Masters')
          transform('en/masters.html', "Former Master's students and interns")
          PY
      - name: Validate site
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          python - <<'PY'
          from pathlib import Path
          for path, heading in [('masters.html','Anciens Masters'), ('en/masters.html', "Former Master's students and interns")]:
              s=Path(path).read_text(encoding='utf-8')
              section=s.split(f'<h2>{heading}</h2>',1)[1].split('</section>',1)[0]
              assert 'class="people-grid"' in section
              assert section.count('<div class="people-entry">') >= 2
          print('Former masters use people-grid in both languages')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masters.html en/masters.html
          git commit -m 'Lay out former masters in two columns'
          git push
