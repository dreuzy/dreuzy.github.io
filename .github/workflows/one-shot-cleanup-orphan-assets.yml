name: One-shot cleanup orphan assets
on:
  push:
    paths:
      - '.github/workflows/one-shot-cleanup-orphan-assets.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-audit and remove only exact orphan asset set
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          workflow='.github/workflows/one-shot-cleanup-orphan-assets.yml'
          text_ext={'.html','.css','.js','.py','.yml','.yaml','.json','.md','.xml','.txt'}
          source=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.as_posix()==workflow: continue
              if p.as_posix().startswith('assets/'): continue
              if p.suffix.lower() not in text_ext: continue
              try: source.append(p.read_text(encoding='utf-8'))
              except Exception: pass
          assets=[]
          for p in (root/'assets').rglob('*'):
              if not p.is_file() or 'figure-data' in p.parts: continue
              rel=p.as_posix()
              if not any(rel in s for s in source): assets.append(rel)
          actual=set(assets)
          expected={
            'assets/pyages-concept.avif','assets/pyages-groundwater-age.webp','assets/figures/futureflow.svg',
            'assets/figures/hydromodpy-illustration.webp','assets/figures/research-fractured.svg','assets/figures/hydromodpy-workflow.jpg',
            'assets/figures/gallery-pleine-fougeres-flowpaths.svg','assets/figures/gallery-surface-subsurface-coupling.svg','assets/figures/chair.svg',
            'assets/figures/research-transfers.svg','assets/figures/reactivity-stratification-2019.webp','assets/figures/gallery-thermal-storage.svg',
            'assets/figures/stream-network-calibration.jpg','assets/figures/stream-network-calibration-2023.webp','assets/figures/gallery-gravity-storage.svg',
            'assets/figures/research-headwaters.svg','assets/figures/research-climate.svg','assets/figures/research-hydromodpy.svg'
          }
          print('Detected orphan assets:', ', '.join(sorted(actual)))
          if actual != expected:
              raise SystemExit(f'Guard failed. Missing={sorted(expected-actual)} Extra={sorted(actual-expected)}')
          total=0
          for rel in sorted(expected):
              p=Path(rel); total += p.stat().st_size; p.unlink()
          print(f'Removed {len(expected)} orphan assets, {total} bytes')
          PY
      - name: Validate site after asset cleanup
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          test -s assets/pyages-software-figure.png
          test -s assets/pyages-groundwater-age-v2.webp
          test -s assets/figures/fractured-media-channeling.png
          test -s assets/figures/eau-territoire.png
          test -s assets/figures/futureflow-framework.webp
          test -s assets/figures/hydromodpy-approved.webp
          test -s assets/figures/onewater.svg
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets
          git commit -m 'Remove orphaned image assets'
          git push
