name: One-shot website audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-site-audit.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Finalize audited profile updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Synchronize audited profiles
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '<strong>Poste actuel :</strong> Cheffe de projets – Hydrogéologue, Ginger BURGEAP': '<strong>Poste actuel :</strong> Veolia',
              '<strong>Current position:</strong> Project Manager – Hydrogeologist, Ginger BURGEAP': '<strong>Current position:</strong> Veolia',
              '<strong>Poste actuel :</strong> Chercheur, LMD (CNRS / Sorbonne Université), équipe PLANETO': '<strong>Poste actuel :</strong> Postdoctorant, LMD — CNRS / IPSL / Sorbonne Université, équipe PLANETO',
              '<strong>Current position:</strong> Researcher, LMD (CNRS / Sorbonne University), PLANETO team': '<strong>Current position:</strong> Postdoctoral Researcher, LMD — CNRS / IPSL / Sorbonne University, PLANETO team',
          }
          files = ['equipe.html', 'en/team.html', 'masters.html', 'en/masters.html']
          changed=[]
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              ns=s
              for old,new in replacements.items():
                  ns=ns.replace(old,new)
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(name)

          stale=[]
          for name in files:
              text=Path(name).read_text(encoding='utf-8')
              for old in replacements:
                  if old in text:
                      stale.append(f'{name}: {old}')
          if stale:
              raise SystemExit('Stale profile strings remain:\n' + '\n'.join(stale))
          print('Updated:', ', '.join(changed) if changed else 'none needed')
          PY
      - name: Validate bilingual mirror and local links
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
      - name: Commit profile corrections
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add equipe.html en/team.html masters.html en/masters.html
            git commit -m 'Synchronize audited current positions'
            git push
          fi
