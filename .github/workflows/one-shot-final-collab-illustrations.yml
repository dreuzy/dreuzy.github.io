name: One-shot final collaborations and illustrations
on:
  push:
    paths:
      - '.github/workflows/one-shot-final-collab-illustrations.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply final updates
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              for old,new in replacements:
                  if old not in s:
                      raise SystemExit(f'Missing pattern in {path}: {old[:120]}')
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          # Current collaborations: add Thierry Labasque in FR/EN.
          for path in ['equipe.html','en/team.html']:
              edit(path,[
                  ('<strong>Laurent Longuevergne</strong> · <strong>Tanguy Le Borgne</strong> · <strong>Camille Bouchez</strong>',
                   '<strong>Laurent Longuevergne</strong> · <strong>Tanguy Le Borgne</strong> · <strong>Thierry Labasque</strong> · <strong>Camille Bouchez</strong>')
              ])

          # CV FR.
          edit('cv.html',[
              ('<p><strong>2018–2024</strong> — Membre du comité permanent de Computational Methods in Water Resources ; organisateur de CMWR 2018 à Saint-Malo.</p>',
               '<p><strong>2018–2024</strong> — Membre du comité permanent de Computational Methods in Water Resources.</p>'),
              ('<section class="section-block"><h2>Activités éditoriales antérieures</h2><p><strong>Hydrogeology Journal, 2006–2011</strong> — éditeur associé.</p><p><strong>Journal of Hydrology, 2013–2018</strong> — éditeur associé.</p><p><strong>Journal of Hydrology, 2016</strong> — co-éditeur, avec Timothy R. Ginn, du numéro spécial <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p></section>',
               '<section class="section-block"><h2>Principales activités éditoriales et d’animation scientifique</h2><p><strong>Hydrogeology Journal, 2006–2011</strong> — éditeur associé.</p><p><strong>Journal of Hydrology, 2013–2018</strong> — éditeur associé.</p><p><strong>Journal of Hydrology, 2016</strong> — co-éditeur, avec Timothy R. Ginn, du numéro spécial <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p><p><strong><a href="https://oseren.univ-rennes.fr/actualites/computational-methods-water-resources-cmwr" target="_blank" rel="noopener">CMWR 2018, Saint-Malo</a></strong> — co-président, avec Jocelyne Erhel et Tanguy Le Borgne, de la XXIIe conférence <em>Computational Methods in Water Resources</em>, 3–7 juin 2018.</p></section>'),
              ('<strong>Benoît Noetinger</strong> (IFP Energies nouvelles — changement d’échelle, transport stochastique et milieux fracturés), <strong>Jacques Bodin</strong>',
               '<strong>Benoît Noetinger</strong> (IFP Energies nouvelles — changement d’échelle, transport stochastique et milieux fracturés), <strong>Alain Rapaport</strong> (MISTEA, INRAE — modélisation mathématique, transport réactif et processus microbiens), <strong>Jacques Bodin</strong>')
          ])

          # CV EN mirror.
          edit('en/cv.html',[
              ('<p><strong>2018–2024</strong> — Member of the Standing Committee for Computational Methods in Water Resources; organiser of CMWR 2018 in Saint-Malo.</p>',
               '<p><strong>2018–2024</strong> — Member of the Standing Committee for Computational Methods in Water Resources.</p>'),
              ('<section class="section-block"><h2>Past editorial activities</h2><p><strong>Hydrogeology Journal, 2006–2011</strong> — Associate Editor.</p><p><strong>Journal of Hydrology, 2013–2018</strong> — Associate Editor.</p><p><strong>Journal of Hydrology, 2016</strong> — co-editor, with Timothy R. Ginn, of the special issue <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p></section>',
               '<section class="section-block"><h2>Selected editorial and scientific-community activities</h2><p><strong>Hydrogeology Journal, 2006–2011</strong> — Associate Editor.</p><p><strong>Journal of Hydrology, 2013–2018</strong> — Associate Editor.</p><p><strong>Journal of Hydrology, 2016</strong> — co-editor, with Timothy R. Ginn, of the special issue <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p><p><strong><a href="https://oseren.univ-rennes.fr/actualites/computational-methods-water-resources-cmwr" target="_blank" rel="noopener">CMWR 2018, Saint-Malo</a></strong> — conference co-chair, with Jocelyne Erhel and Tanguy Le Borgne, for the 22nd <em>Computational Methods in Water Resources</em> conference, 3–7 June 2018.</p></section>'),
              ('<strong>Benoît Noetinger</strong> (IFP Energies nouvelles — upscaling, stochastic transport and fractured media), <strong>Jacques Bodin</strong>',
               '<strong>Benoît Noetinger</strong> (IFP Energies nouvelles — upscaling, stochastic transport and fractured media), <strong>Alain Rapaport</strong> (MISTEA, INRAE — mathematical modelling, reactive transport and microbial processes), <strong>Jacques Bodin</strong>')
          ])

          gallery_fr='''<div class="outreach-gallery science-featured-covers"><figure><a href="https://grand-format.net/quand-les-nappes-montent/" target="_blank" rel="noopener"><img src="https://grand-format.net/wp-content/uploads/2025/12/BD-Normandie-Nappes_004-1.jpg" alt="Illustration de la bande dessinée Quand les nappes montent" loading="lazy" referrerpolicy="no-referrer"></a><figcaption><strong>Quand les nappes montent</strong><br>Simon Gouin · Vincent Sorel · Grand Format, 2025 · à partir des travaux de RIVAGES Normands 2100.</figcaption></figure><figure><a href="https://www.cnrseditions.fr/catalogue/ecologie-environnement-sciences-de-la-terre/tout-comprendre-ou-presque-sur-l-eau/" target="_blank" rel="noopener"><img src="https://www.cnrseditions.fr/wp-content/uploads/2024/09/9782271152220.jpg.webp" alt="Couverture du livre Tout comprendre ou presque sur l’eau" loading="lazy" referrerpolicy="no-referrer"></a><figcaption><strong>Tout comprendre (ou presque) sur l’eau</strong><br>CNRS Éditions, 2024 · contributions à deux chapitres.</figcaption></figure></div>'''
          gallery_en='''<div class="outreach-gallery science-featured-covers"><figure><a href="https://grand-format.net/quand-les-nappes-montent/" target="_blank" rel="noopener"><img src="https://grand-format.net/wp-content/uploads/2025/12/BD-Normandie-Nappes_004-1.jpg" alt="Illustration from the comic Quand les nappes montent" loading="lazy" referrerpolicy="no-referrer"></a><figcaption><strong>Quand les nappes montent</strong><br>Simon Gouin · Vincent Sorel · Grand Format, 2025 · based on RIVAGES Normands 2100 research.</figcaption></figure><figure><a href="https://www.cnrseditions.fr/catalogue/ecologie-environnement-sciences-de-la-terre/tout-comprendre-ou-presque-sur-l-eau/" target="_blank" rel="noopener"><img src="https://www.cnrseditions.fr/wp-content/uploads/2024/09/9782271152220.jpg.webp" alt="Cover of Tout comprendre ou presque sur l’eau" loading="lazy" referrerpolicy="no-referrer"></a><figcaption><strong>Tout comprendre (ou presque) sur l’eau</strong><br>CNRS Éditions, 2024 · contributions to two chapters.</figcaption></figure></div>'''

          edit('science-societe.html',[
              ('<h3>Médias, articles et ouvrages</h3>', '<h3>Médias, articles et ouvrages</h3>'+gallery_fr)
          ])
          edit('en/science-society.html',[
              ('<h3>Media, articles and books</h3>', '<h3>Media, articles and books</h3>'+gallery_en)
          ])
          PY
      - name: Check illustration sources
        run: |
          curl -fsIL --max-time 20 'https://grand-format.net/wp-content/uploads/2025/12/BD-Normandie-Nappes_004-1.jpg' >/dev/null
          curl -fsIL --max-time 20 'https://www.cnrseditions.fr/wp-content/uploads/2024/09/9782271152220.jpg.webp' >/dev/null
      - name: Validate site
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipe.html en/team.html cv.html en/cv.html science-societe.html en/science-society.html
          git commit -m 'Complete collaborations, CMWR and science-society illustrations'
          git push
