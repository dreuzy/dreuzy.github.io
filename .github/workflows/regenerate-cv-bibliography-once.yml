name: Regenerate scientific CV and bibliography once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-cv-bibliography-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --quiet -r requirements.txt
      - name: Build all generated files
        run: make all
      - name: Commit generated outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cv/CV_Jean-Raynald_de_Dreuzy_2026.pdf bibliographie.html en/bibliography.html publications-au-fil-du-temps.html en/publications-over-time.html publications-au-fil-du-temps.svg en/publications-over-time.svg publications-au-fil-du-temps-data.json publications.html en/publications.html
          if git diff --cached --quiet; then
            echo 'Already synchronized'
            exit 0
          fi
          git commit -m 'Synchronize CV PDF and bibliography with reviewed source records'
          git pull --rebase
          git push
