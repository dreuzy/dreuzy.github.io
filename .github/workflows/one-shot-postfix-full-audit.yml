name: One-shot post-fix full audit
on:
  push:
    paths:
      - '.github/workflows/one-shot-postfix-full-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full source and SEO validation
        run: |
          set -euo pipefail
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, xml.etree.ElementTree as ET

          root=Path('.')
          files=sorted(p for p in root.rglob('*.html') if '.git' not in p.parts)
          errs=[]; content=[]; redirects=[]; indexable=set(); noindex=[]
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.lang=None; self.meta=[]; self.canon=[]; self.alt=[]; self.h1=0; self.img=[]; self.refresh=False; self.robots=[]; self.og=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='html': self.lang=a.get('lang')
                  if t=='meta' and a.get('name')=='description': self.meta.append(a.get('content',''))
                  if t=='meta' and a.get('name')=='robots': self.robots.append(a.get('content',''))
                  if t=='meta' and a.get('property')=='og:url': self.og.append(a.get('content',''))
                  if t=='meta' and a.get('http-equiv','').lower()=='refresh': self.refresh=True
                  if t=='link' and a.get('rel')=='canonical': self.canon.append(a.get('href',''))
                  if t=='link' and a.get('rel')=='alternate' and a.get('hreflang'): self.alt.append((a.get('hreflang'),a.get('href','')))
                  if t=='h1': self.h1+=1
                  if t=='img': self.img.append(a)
          canon={}
          for p in files:
              s=p.read_text(encoding='utf-8'); q=P(); q.feed(s)
              if q.lang not in ('fr','en'): errs.append(f'{p}: bad lang')
              if not re.search(r'<title>\s*.+?\s*</title>',s,re.S|re.I): errs.append(f'{p}: bad title')
              if q.refresh:
                  redirects.append(str(p));
                  if len(q.canon)!=1: errs.append(f'{p}: redirect canonical count')
                  continue
              content.append(str(p))
              if len(q.meta)!=1 or not q.meta[0].strip(): errs.append(f'{p}: bad description')
              if len(q.canon)!=1 or not q.canon[0].startswith('https://dreuzy.github.io/'): errs.append(f'{p}: bad canonical')
              else: canon.setdefault(q.canon[0],[]).append(str(p))
              if q.h1!=1: errs.append(f'{p}: h1={q.h1}')
              if not {'fr','en','x-default'}.issubset({x for x,_ in q.alt}): errs.append(f'{p}: hreflang incomplete')
              if q.og and q.canon and q.og[0]!=q.canon[0]: errs.append(f'{p}: og:url mismatch')
              for im in q.img:
                  if not im.get('alt'): errs.append(f'{p}: missing image alt')
              if any('noindex' in x.lower() for x in q.robots): noindex.append(str(p))
              elif q.canon: indexable.add(q.canon[0])
          for c,ps in canon.items():
              if len(ps)>1: errs.append(f'duplicate canonical {c}: {ps}')

          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs={e.text.strip() for e in ET.parse('sitemap.xml').findall('.//sm:loc',ns) if e.text}
          if locs!=indexable:
              errs.append(f'sitemap mismatch missing={sorted(indexable-locs)} extra={sorted(locs-indexable)}')
          if len(locs)!=36: errs.append(f'sitemap URL count={len(locs)}, expected 36')
          for u in ['https://dreuzy.github.io/galerie-recherche.html','https://dreuzy.github.io/en/research-figures.html']:
              if u in locs: errs.append(f'noindex gallery remains in sitemap: {u}')
          if 'Sitemap: https://dreuzy.github.io/sitemap.xml' not in Path('robots.txt').read_text(encoding='utf-8'): errs.append('robots sitemap missing')

          # Permanent workflows are exactly these four; ignore temporary one-shot audit/fix workflows.
          permanent={p.name for p in (root/'.github/workflows').glob('*.yml') if not p.name.startswith('one-shot-')}
          expected={'build-pyages-image.yml','check-bilingual-mirror.yml','update-publications-over-time.yml','verify-pyages-live.yml'}
          if permanent!=expected: errs.append(f'permanent workflow mismatch {sorted(permanent)}')

          # Zero orphan normal assets.
          text_ext={'.html','.css','.js','.py','.yml','.yaml','.json','.md','.xml','.txt'}
          source=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.as_posix().startswith('assets/') or p.name.startswith('one-shot-'): continue
              if p.suffix.lower() not in text_ext: continue
              try: source.append(p.read_text(encoding='utf-8'))
              except: pass
          orphans=[]
          for p in (root/'assets').rglob('*'):
              if not p.is_file() or 'figure-data' in p.parts: continue
              rel=p.as_posix()
              if not any(rel in s for s in source): orphans.append(rel)
          if orphans: errs.append(f'orphan assets {orphans}')

          # Figure-data: all used, all sequences complete.
          data=root/'assets/figure-data'; groups={}
          for p in data.glob('*.part-*.txt'):
              m=re.match(r'(.+)\.part-(\d+)\.txt$',p.name)
              if m: groups.setdefault(m.group(1),[]).append(p)
          requested={}; html_names=set()
          for p in files:
              s=p.read_text(encoding='utf-8')
              for name,count in re.findall(r'data-b64-name=["\']([^"\']+)["\'][^>]*data-b64-parts=["\'](\d+)["\']',s):
                  html_names.add(name); requested[name]=max(requested.get(name,0),int(count))
          code=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'assets/figure-data' in p.as_posix() or p.name.startswith('one-shot-'): continue
              if p.suffix.lower() not in {'.js','.py','.yml','.yaml','.json','.md'}: continue
              try: code.append(p.read_text(encoding='utf-8'))
              except: pass
          code_names={name for name in groups if any(re.search(r'(?<![A-Za-z0-9_-])'+re.escape(name)+r'(?![A-Za-z0-9_-])',s) for s in code)}
          unused=sorted(set(groups)-(html_names|code_names))
          if unused: errs.append(f'unused figure-data {unused}')
          for name,n in requested.items():
              for i in range(n):
                  p=data/f'{name}.part-{i:02d}.txt'
                  if not p.exists() or not p.stat().st_size: errs.append(f'missing chunk {p}')
          for i in range(9):
              p=data/f'pyages-final-v2.part-{i:02d}.txt'
              if not p.exists() or not p.stat().st_size: errs.append(f'missing PyAges source {p}')

          # Latest content markers and bibliography payloads.
          checks={
            'masters.html':['<h2>Anciens Masters</h2>','class="people-grid"'],
            'en/masters.html':["Former Master's students and interns",'class="people-grid"'],
            'cv.html':['Computational Methods in Water Resources, 2018–2024','Computational Methods in Water Resources 2018, Saint-Malo','co-organisateur','Thierry Labasque','Alain Rapaport'],
            'en/cv.html':['Computational Methods in Water Resources, 2018–2024','co-organizer','Thierry Labasque','Alain Rapaport'],
            'science-societe.html':['assets/maquette-nappes.jpg','assets/maquette-fractures.jpg']
          }
          for f,needles in checks.items():
              s=Path(f).read_text(encoding='utf-8')
              for n in needles:
                  if n not in s: errs.append(f'{f}: missing {n}')
          css=Path('styles.css').read_text(encoding='utf-8')
          if '.people-grid{display:grid;grid-template-columns:1fr 1fr' not in css or '.people-grid{grid-template-columns:1fr}' not in css: errs.append('people-grid CSS incomplete')
          payloads=sorted(root.glob('bibliographie-payload-*.txt'))
          if len(payloads)!=5 or any(not p.stat().st_size for p in payloads): errs.append('bibliography payload issue')

          print(f'HTML={len(files)} content={len(content)} redirects={len(redirects)} FR={sum("en" not in p.parts for p in files)} EN={sum("en" in p.parts for p in files)}')
          print('Noindex pages:',noindex)
          print(f'Sitemap={len(locs)} indexable={len(indexable)} exact_match={locs==indexable}')
          print(f'Orphan assets={len(orphans)} figure-data families={len(groups)} unused={len(unused)} dynamic chunks={sum(requested.values())}')
          if errs:
              print('ERRORS'); print('\n'.join(errs)); raise SystemExit(1)
          print('POST-FIX SOURCE AUDIT PASS')
          PY
      - name: Full live validation
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import re,time,xml.etree.ElementTree as ET
          base='https://dreuzy.github.io/'; stamp=str(int(time.time())); errs=[]; live={}
          files=sorted(p.as_posix() for p in Path('.').rglob('*.html') if '.git' not in p.parts)
          for rel in files:
              try:
                  with urlopen(Request(base+rel+'?postaudit='+stamp,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=25) as r: b=r.read(); code=r.status
                  if code!=200 or len(b)<80: errs.append(f'{rel}: HTTP {code}')
                  else: live[rel]=b.decode('utf-8','replace')
              except Exception as e: errs.append(f'{rel}: {e}')
          direct=['styles.css','robots.txt','sitemap.xml','bibliography-loader.js','bibliography-updates.js','bibliography-hal.js','assets/pyages-software-figure.png','assets/pyages-groundwater-age-v2.webp','assets/maquette-nappes.jpg','assets/maquette-fractures.jpg','assets/figures/fractured-media-channeling.png','assets/figures/eau-territoire.png','assets/figures/futureflow-framework.webp','assets/figures/hydromodpy-approved.webp','assets/figures/onewater.svg']
          sitemap_bytes=None
          for rel in direct:
              try:
                  with urlopen(Request(base+rel+'?postaudit='+stamp,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=25) as r: b=r.read(); code=r.status
                  if code!=200 or not b: errs.append(f'{rel}: HTTP {code}')
                  if rel=='sitemap.xml': sitemap_bytes=b
              except Exception as e: errs.append(f'{rel}: {e}')
          if sitemap_bytes:
              ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
              locs={e.text.strip() for e in ET.fromstring(sitemap_bytes).findall('.//sm:loc',ns) if e.text}
              if len(locs)!=36: errs.append(f'live sitemap count={len(locs)}')
              for u in ['https://dreuzy.github.io/galerie-recherche.html','https://dreuzy.github.io/en/research-figures.html']:
                  if u in locs: errs.append(f'live sitemap still contains {u}')
          reqs={}
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              for n,c in re.findall(r'data-b64-name=["\']([^"\']+)["\'][^>]*data-b64-parts=["\'](\d+)["\']',s): reqs[n]=max(reqs.get(n,0),int(c))
          chunks=0
          for n,c in reqs.items():
              for i in range(c):
                  rel=f'assets/figure-data/{n}.part-{i:02d}.txt'
                  try:
                      with urlopen(Request(base+rel+'?postaudit='+stamp,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=25) as r: b=r.read(); code=r.status
                      if code!=200 or not b: errs.append(f'{rel}: HTTP {code}')
                      else: chunks+=1
                  except Exception as e: errs.append(f'{rel}: {e}')
          py=0
          for i in range(9):
              rel=f'assets/figure-data/pyages-final-v2.part-{i:02d}.txt'
              try:
                  with urlopen(Request(base+rel+'?postaudit='+stamp,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=25) as r: b=r.read(); code=r.status
                  if code!=200 or not b: errs.append(f'{rel}: HTTP {code}')
                  else: py+=1
              except Exception as e: errs.append(f'{rel}: {e}')
          print(f'LIVE HTML={len(live)}/{len(files)} dynamic_chunks={chunks}/{sum(reqs.values())} PyAges={py}/9')
          if errs:
              print('LIVE ERRORS'); print('\n'.join(errs)); raise SystemExit(2)
          print('POST-FIX LIVE AUDIT PASS')
          PY
      - name: External links final audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          import concurrent.futures
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.u=[]
              def handle_starttag(self,t,a):
                  u=dict(a).get('href')
                  if u and u.startswith(('http://','https://')) and 'dreuzy.github.io' not in u: self.u.append(u)
          urls=set()
          for p in Path('.').rglob('*.html'):
              q=P(); q.feed(p.read_text(encoding='utf-8')); urls.update(q.u)
          def chk(u):
              for method in ('HEAD','GET'):
                  try:
                      with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'},method=method),timeout=10) as r: return u,r.status,None
                  except Exception as e: last=e
              return u,None,f'{type(last).__name__}: {last}'
          ok=0; bad=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for u,s,e in ex.map(chk,sorted(urls)):
                  if s and s<400: ok+=1
                  else: bad.append((u,s,e))
          print(f'EXTERNAL unique={len(urls)} reachable={ok} unresolved={len(bad)}')
          for u,s,e in bad: print('EXTERNAL WARN',s,u,e)
          PY
