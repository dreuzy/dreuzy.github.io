name: One-shot update Flore Sergeant review status
on:
  push:
    paths:
      - '.github/workflows/one-shot-flore-sergeant-review-status.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Update selected publications and bibliography source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, Tag, NavigableString
          import base64, gzip, math, re, unicodedata

          TITLE='Headwater catchments: from aqua incognita to aqua cognita'

          def norm(s):
              s=unicodedata.normalize('NFD',s or '')
              s=''.join(c for c in s if unicodedata.category(c)!='Mn')
              return re.sub(r'\s+',' ',s).strip().lower()

          # Selected publications: exact guarded replacements, only for the headwater paper.
          replacements={
            'publications.html':(
              'F. Sergeant, J.-R. de Dreuzy, S. Bernal, M. Ross &amp; G. Pinay (2026) · soumis à <span class="smallcaps">Hydrological Processes</span>',
              'F. Sergeant, J.-R. de Dreuzy, S. Bernal, M. Ross &amp; G. Pinay (2026) · en révision pour <span class="smallcaps">Hydrological Processes</span>'
            ),
            'en/publications.html':(
              'F. Sergeant, J.-R. de Dreuzy, S. Bernal, M. Ross &amp; G. Pinay (2026) · submitted to <span class="smallcaps">Hydrological Processes</span>',
              'F. Sergeant, J.-R. de Dreuzy, S. Bernal, M. Ross &amp; G. Pinay (2026) · under review at <span class="smallcaps">Hydrological Processes</span>'
            )
          }
          for fn,(old,new) in replacements.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              if s.count(old)!=1:
                  raise SystemExit(f'Guard failed: expected selected-publication status exactly once in {fn}, got {s.count(old)}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Decode the canonical bibliography payload.
          payloads=[Path(f'bibliographie-payload-0{i}.txt') for i in range(1,6)]
          b64=''.join(p.read_text(encoding='utf-8') for p in payloads)
          raw=gzip.decompress(base64.b64decode(re.sub(r'\s+','',b64))).decode('utf-8')
          soup=BeautifulSoup(raw,'html.parser')

          # Find exactly one list item for the target article.
          candidates=[]
          for el in soup.find_all(['li','p']):
              if norm(TITLE) in norm(el.get_text(' ',strip=True)):
                  candidates.append(el)
          if len(candidates)!=1:
              raise SystemExit(f'Guard failed: target bibliography entry count={len(candidates)}')
          entry=candidates[0]
          if entry.name!='li':
              raise SystemExit(f'Guard failed: target bibliography entry is <{entry.name}>, expected <li>')

          headings=soup.find_all(re.compile(r'^h[1-6]$'))
          def heading_named(*names):
              wanted={norm(x) for x in names}
              return next((h for h in headings if norm(h.get_text(' ',strip=True)) in wanted),None)

          submitted=heading_named('Soumis','Submitted')
          review=heading_named('En révision','En revision','Under review','In review')
          if not submitted:
              raise SystemExit('Guard failed: Submitted/Soumis heading not found')
          if not review:
              # Create a review section immediately after the submitted section's list.
              review=soup.new_tag(submitted.name)
              review.string='En révision'
              sub_list=submitted.find_next_sibling(['ol','ul'])
              if not sub_list:
                  raise SystemExit('Guard failed: submitted list not found')
              review_list=soup.new_tag('ul')
              sub_list.insert_after(review)
              review.insert_after(review_list)
          else:
              review_list=review.find_next_sibling(['ol','ul'])
              if not review_list:
                  review_list=soup.new_tag('ul')
                  review.insert_after(review_list)

          # Confirm target currently sits under the Submitted heading, not another status.
          prev_heading=entry.find_previous(re.compile(r'^h[1-6]$'))
          if prev_heading is None or prev_heading is not submitted:
              raise SystemExit(f'Guard failed: target is not currently in Submitted section; previous heading={prev_heading.get_text(" ",strip=True) if prev_heading else None}')

          # Replace an explicit submitted phrase inside this entry, if present.
          for node in list(entry.descendants):
              if isinstance(node,NavigableString):
                  text=str(node)
                  new=text
                  new=re.sub(r'\b[Ss]oumis\s+à\b','En révision pour',new)
                  new=re.sub(r'\b[Ss]ubmitted\s+to\b','Under review at',new)
                  if new!=text:
                      node.replace_with(new)

          # Move the entry at the top of the review list.
          entry.extract()
          review_list.insert(0,entry)

          # Validate target location/status after the move.
          new_prev=entry.find_previous(re.compile(r'^h[1-6]$'))
          if new_prev is None or new_prev is not review:
              raise SystemExit('Guard failed: target did not move to review section')
          if norm(TITLE) not in norm(entry.get_text(' ',strip=True)):
              raise SystemExit('Guard failed: target title altered unexpectedly')

          # Re-encode as gzip + Base64 and keep exactly five payload files.
          html=str(soup)
          encoded=base64.b64encode(gzip.compress(html.encode('utf-8'),mtime=0)).decode('ascii')
          size=math.ceil(len(encoded)/5)
          chunks=[encoded[i*size:(i+1)*size] for i in range(5)]
          if not all(chunks):
              raise SystemExit('Guard failed: empty bibliography payload chunk')
          if ''.join(chunks)!=encoded:
              raise SystemExit('Guard failed: payload split mismatch')
          for p,chunk in zip(payloads,chunks):
              p.write_text(chunk+'\n',encoding='utf-8')

          # Decode again to ensure the written payload is valid and target is under review.
          reread=''.join(p.read_text(encoding='utf-8') for p in payloads)
          check=BeautifulSoup(gzip.decompress(base64.b64decode(re.sub(r'\s+','',reread))).decode('utf-8'),'html.parser')
          matches=[el for el in check.find_all('li') if norm(TITLE) in norm(el.get_text(' ',strip=True))]
          if len(matches)!=1:
              raise SystemExit(f'Post-write target count={len(matches)}')
          h=matches[0].find_previous(re.compile(r'^h[1-6]$'))
          if not h or norm(h.get_text(' ',strip=True)) not in {norm('En révision'),norm('Under review'),norm('In review')}:
              raise SystemExit(f'Post-write status heading wrong: {h.get_text(" ",strip=True) if h else None}')
          print('Updated target article from submitted to under review in selected publications and bibliography payload.')
          PY
      - name: Validate site
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          python - <<'PY'
          from pathlib import Path
          title='Headwater catchments: from aqua incognita to aqua cognita'
          fr=Path('publications.html').read_text(encoding='utf-8')
          en=Path('en/publications.html').read_text(encoding='utf-8')
          assert title in fr and 'en révision pour <span class="smallcaps">Hydrological Processes</span>' in fr
          assert title in en and 'under review at <span class="smallcaps">Hydrological Processes</span>' in en
          print('Selected publications FR/EN status markers verified.')
          PY
      - name: Commit update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications.html en/publications.html bibliographie-payload-*.txt
          git commit -m 'Move Flore Sergeant headwater paper to under review'
          git push
