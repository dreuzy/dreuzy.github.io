name: One-shot proceedings count
on:
  push:
    paths:
      - '.github/workflows/one-shot-proceedings-count.yml'
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet beautifulsoup4
      - name: Count proceedings by year
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, Tag
          import base64, gzip, re, unicodedata, json

          raw=''.join(Path(f'bibliographie-payload-0{i}.txt').read_text() for i in range(1,6))
          html=gzip.decompress(base64.b64decode(re.sub(r'\s+','',raw))).decode('utf-8')
          soup=BeautifulSoup(html,'html.parser')

          def norm(s):
              s=unicodedata.normalize('NFD',s or '')
              s=''.join(c for c in s if unicodedata.category(c)!='Mn')
              return re.sub(r'\s+',' ',s).strip().lower()

          wanted = {
              'proceedings references dans web of knowledge',
              'proceedings non references dans web of knowledge',
          }
          entries=[]
          for h in soup.find_all(re.compile('^h[1-6]$')):
              if norm(h.get_text(' ',strip=True)) not in wanted:
                  continue
              level=int(h.name[1])
              node=h.find_next_sibling()
              while node:
                  if isinstance(node,Tag) and re.match('^h[1-6]$',node.name) and int(node.name[1])<=level:
                      break
                  if isinstance(node,Tag) and node.name in ('ol','ul'):
                      entries += [li.get_text(' ',strip=True) for li in node.find_all('li',recursive=False)]
                  node=node.find_next_sibling()

          counts={}
          for e in entries:
              m=re.search(r'\((19\d{2}|20\d{2})\)',e) or re.search(r'\b(19\d{2}|20\d{2})\b',e)
              if m:
                  y=int(m.group(1)); counts[y]=counts.get(y,0)+1
          print('PROCEEDINGS_COUNTS_JSON='+json.dumps(dict(sorted(counts.items())),sort_keys=True))
          print('PROCEEDINGS_TOTAL='+str(len(entries)))
          PY