name: Update publications over time

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 1 1 *'
  push:
    branches: [main]
    paths:
      - 'data/bibliography.json'
      - 'scripts/build_publications_over_time.py'
      - 'scripts/build_static_bibliography.py'
      - 'requirements.txt'
      - '.github/workflows/update-publications-over-time.yml'

permissions:
  contents: write

concurrency:
  group: update-publications-over-time-main
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild publication history figures
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install plotting dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Rebuild bibliography, figures and data
        run: make bibliography
      - name: Validate the complete site
        run: make check
      - name: Commit regenerated figures when needed
        run: |
          if git diff --quiet -- bibliographie.html en/bibliography.html publications-au-fil-du-temps.html en/publications-over-time.html publications-au-fil-du-temps.svg en/publications-au-fil-du-temps.svg publications-au-fil-du-temps-data.json; then
            echo 'Bibliography and publication-history outputs are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bibliographie.html en/bibliography.html publications-au-fil-du-temps.html en/publications-over-time.html publications-au-fil-du-temps.svg en/publications-au-fil-du-temps.svg publications-au-fil-du-temps-data.json
          git commit -m 'Refresh bibliography and publication history'
          git pull --rebase
          git push
