name: Update publications over time

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bibliographie-payload-*.txt'
      - 'scripts/build_publications_over_time.py'
      - '.github/workflows/update-publications-over-time.yml'

permissions:
  contents: write

jobs:
  build:
    name: Rebuild publication history figures
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install plotting dependencies
        run: python -m pip install --quiet matplotlib beautifulsoup4
      - name: Rebuild figures and data
        run: python scripts/build_publications_over_time.py
      - name: Validate local links
        run: python scripts/check_local_links.py
      - name: Commit regenerated figures when needed
        run: |
          if git diff --quiet -- publications-au-fil-du-temps.svg en/publications-au-fil-du-temps.svg publications-au-fil-du-temps-data.json; then
            echo 'Publication-history outputs are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications-au-fil-du-temps.svg en/publications-au-fil-du-temps.svg publications-au-fil-du-temps-data.json
          git commit -m 'Refresh publications over time'
          git push
