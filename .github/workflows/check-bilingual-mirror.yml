name: Check bilingual mirror

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the latest check while both language pages are updated in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    name: Verify FR/EN page parity and local links
    runs-on: ubuntu-latest
    steps:
      - name: Allow paired edits on main to arrive
        if: github.event_name == 'push'
        run: sleep 120
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the bilingual mirror
        run: python scripts/check_bilingual_mirror.py
      - name: Validate local links and resources
        run: python scripts/check_local_links.py
