name: One-shot final bibliography cross-check
on:
  push:
    paths:
      - '.github/workflows/one-shot-audit-bibliography-final-crosscheck.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet beautifulsoup4 requests
      - name: Cross-check all external article records against all bibliography sections
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import base64,gzip,re,unicodedata,json,requests
          from difflib import SequenceMatcher
          ORCID='0000-0003-2993-2015'; NAME='Jean-Raynald de Dreuzy'
          S=requests.Session(); S.headers['User-Agent']='dreuzy-final-bib-audit/1.0'
          def norm(s):
            s=unicodedata.normalize('NFKD',s or '')
            s=''.join(c for c in s if not unicodedata.combining(c)).lower()
            s=s.replace('–','-').replace('—','-')
            s=re.sub(r'[^a-z0-9]+',' ',s)
            return re.sub(r'\s+',' ',s).strip()
          def nd(s):
            if not s:return ''
            s=str(s).lower().strip(); s=re.sub(r'^https?://(?:dx\.)?doi\.org/','',s); return s.rstrip('.,;) ]')
          def sim(a,b):
            a,b=norm(a),norm(b)
            if not a or not b:return 0
            if a==b:return 1
            if min(len(a),len(b))>=28 and (a in b or b in a):return .97
            return SequenceMatcher(None,a,b).ratio()
          raw=gzip.decompress(base64.b64decode(re.sub(r'\s+','',''.join(Path(f'bibliographie-payload-0{i}.txt').read_text() for i in range(1,6))))).decode('utf-8')
          soup=BeautifulSoup(raw,'html.parser')
          all_entries=[]
          for el in soup.find_all(['li','p']):
            txt=el.get_text(' ',strip=True)
            if txt:
              h=el.find_previous(re.compile(r'^h[1-6]$'))
              all_entries.append({'text':txt,'section':h.get_text(' ',strip=True) if h else ''})
          print('FULL_BIB_ENTRIES='+str(len(all_entries)))
          ext=[]
          def add(src,title,doi='',year=None,typ='',container=''):
            if title: ext.append({'source':src,'title':str(title).strip(),'doi':nd(doi),'year':year,'type':typ,'container':container or ''})
          # HAL ART
          r=S.get('https://api.archives-ouvertes.fr/search/',params={'q':f'authFullName_s:"{NAME}"','fl':'title_s,doiId_s,producedDateY_i,docType_s,journalTitle_s','rows':1000,'wt':'json'},timeout=30); r.raise_for_status()
          for d in r.json().get('response',{}).get('docs',[]):
            if d.get('docType_s')!='ART':continue
            t=d.get('title_s'); t=t[0] if isinstance(t,list) else t
            doi=d.get('doiId_s'); doi=doi[0] if isinstance(doi,list) else doi
            add('HAL',t,doi,d.get('producedDateY_i'),'ART',d.get('journalTitle_s',''))
          # ORCID public works - lower-case and upper-case accepted
          r=S.get(f'https://pub.orcid.org/v3.0/{ORCID}/works',headers={'Accept':'application/json'},timeout=30)
          if r.ok:
            for g in r.json().get('group',[]):
              for w in (g.get('work-summary') or [])[:1]:
                typ=(w.get('type') or '').lower()
                if typ not in ('journal-article','review-article','journal_article','review_article'):continue
                t=((w.get('title') or {}).get('title') or {}).get('value','')
                year=(((w.get('publication-date') or {}).get('year') or {}).get('value'))
                doi=''
                for e in ((w.get('external-ids') or {}).get('external-id') or []):
                  if (e.get('external-id-type') or '').lower()=='doi':doi=e.get('external-id-value','');break
                add('ORCID',t,doi,year,typ)
          print('ORCID_ARTICLE_RECORDS='+str(sum(x['source']=='ORCID' for x in ext)))
          # OpenAlex via ORCID
          r=S.get(f'https://api.openalex.org/authors/https://orcid.org/{ORCID}',timeout=30); r.raise_for_status(); aid=r.json()['id'].split('/')[-1]
          cursor='*'
          while cursor:
            rr=S.get('https://api.openalex.org/works',params={'filter':f'author.id:{aid}','per-page':200,'cursor':cursor},timeout=30); rr.raise_for_status(); js=rr.json()
            for w in js.get('results',[]):
              if w.get('type') not in ('article','review','letter','editorial'):continue
              loc=w.get('primary_location') or {}; source=loc.get('source') or {}
              add('OpenAlex',w.get('title',''),w.get('doi',''),w.get('publication_year'),w.get('type',''),source.get('display_name',''))
            if not js.get('results'):break
            cursor=js.get('meta',{}).get('next_cursor')
          # Crossref exact author, journal-article only
          for offset in (0,1000):
            rr=S.get('https://api.crossref.org/works',params={'query.author':NAME,'rows':1000,'offset':offset,'select':'DOI,title,author,published,type,container-title'},timeout=60); rr.raise_for_status(); items=rr.json()['message']['items']
            for w in items:
              if w.get('type')!='journal-article':continue
              ok=False
              for a in w.get('author') or []:
                fam=norm(a.get('family','')); giv=norm(a.get('given','')); oid=a.get('ORCID','') or ''
                if ORCID in oid or (fam in ('de dreuzy','dreuzy') and ('jean' in giv or 'raynald' in giv or giv.startswith('j r'))):ok=True;break
              if not ok:continue
              parts=((w.get('published') or {}).get('date-parts') or [[None]])[0]
              add('Crossref',(w.get('title') or [''])[0],w.get('DOI',''),parts[0] if parts else None,w.get('type',''),(w.get('container-title') or [''])[0])
            if len(items)<1000:break
          # dedupe, merge source metadata
          groups={}
          for x in ext:
            key=('doi',x['doi']) if x['doi'] else ('title',norm(x['title']))
            if key not in groups:groups[key]={**x,'sources':{x['source']},'containers':{x['container']} if x['container'] else set()}
            else:
              groups[key]['sources'].add(x['source'])
              if x['container']:groups[key]['containers'].add(x['container'])
          missing=[]
          for x in groups.values():
            best=max(((sim(x['title'],e['text']),e) for e in all_entries),key=lambda z:z[0])
            if best[0]<0.88:
              missing.append((x,best[0],best[1]))
          missing.sort(key=lambda z:(-len(z[0]['sources']),0 if z[0]['doi'] else 1,-z[1],str(z[0]['year'])))
          print('EXTERNAL_ARTICLE_UNION='+str(len(groups)))
          print('FULL_BIB_UNMATCHED='+str(len(missing)))
          for x,score,e in missing:
            print(json.dumps({'title':x['title'],'doi':x['doi'],'year':x['year'],'sources':sorted(x['sources']),'containers':sorted(x['containers']),'best_score':round(score,3),'best_entry':e['text'],'best_section':e['section']},ensure_ascii=False))
          PY
