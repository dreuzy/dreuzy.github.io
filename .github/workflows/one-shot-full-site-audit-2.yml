name: One-shot full site audit 2
on:
  push:
    paths:
      - '.github/workflows/one-shot-full-site-audit-2.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source audit
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.lang=None; self.canon=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='html': self.lang=a.get('lang')
                  if tag=='link' and a.get('rel')=='canonical': self.canon.append(a.get('href'))

          files=sorted(p for p in Path('.').rglob('*.html') if '.git' not in p.parts)
          errors=[]
          for p in files:
              s=p.read_text(encoding='utf-8'); q=P(); q.feed(s)
              if q.lang not in ('fr','en'): errors.append(f'{p}: invalid lang')
              if len(q.canon)!=1: errors.append(f'{p}: canonical count {len(q.canon)}')
              if '<title>' not in s: errors.append(f'{p}: missing title')
          required={
            'masters.html':['<h2>Anciens Masters</h2>','class="people-grid"'],
            'en/masters.html':["<h2>Former Master's students and interns</h2>",'class="people-grid"'],
            'cv.html':['Computational Methods in Water Resources, 2018–2024','Computational Methods in Water Resources 2018, Saint-Malo','co-organisateur','Thierry Labasque','Alain Rapaport'],
            'en/cv.html':['Computational Methods in Water Resources, 2018–2024','co-organizer','Thierry Labasque','Alain Rapaport'],
            'science-societe.html':['assets/maquette-nappes.jpg','assets/maquette-fractures.jpg'],
            'en/science-society.html':['../assets/maquette-nappes.jpg','../assets/maquette-fractures.jpg']}
          for f,needles in required.items():
              s=Path(f).read_text(encoding='utf-8')
              for n in needles:
                  if n not in s: errors.append(f'{f}: missing {n}')
          for f,h in [('masters.html','Anciens Masters'),('en/masters.html',"Former Master's students and interns")]:
              s=Path(f).read_text(encoding='utf-8'); sec=s.split(f'<h2>{h}</h2>',1)[1].split('</section>',1)[0]
              print(f'{f}: former-master entries={sec.count("people-entry")}, people-grid={"people-grid" in sec}')
          print(f'SOURCE pages={len(files)}, FR={sum("en" not in p.parts for p in files)}, EN={sum("en" in p.parts for p in files)}')
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print('SOURCE AUDIT PASS')
          PY
      - name: Live audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import time
          base='https://dreuzy.github.io/'
          stamp=str(int(time.time()))
          files=sorted(p.as_posix() for p in Path('.').rglob('*.html') if '.git' not in p.parts)
          live={}; errors=[]
          for rel in files:
              try:
                  req=Request(base+rel+'?audit='+stamp,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urlopen(req,timeout=20) as r: data=r.read().decode('utf-8','replace'); code=r.status
                  if code!=200 or len(data)<100: errors.append(f'{rel}: HTTP {code}, bytes={len(data)}')
                  else: live[rel]=data
              except Exception as e: errors.append(f'{rel}: {type(e).__name__}: {e}')
          for rel in ['styles.css','assets/maquette-nappes.jpg','assets/maquette-fractures.jpg']:
              try:
                  req=Request(base+rel+'?audit='+stamp,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urlopen(req,timeout=20) as r: data=r.read(); code=r.status
                  if code!=200 or not data: errors.append(f'{rel}: asset failed')
                  else: print(f'LIVE ASSET {rel}: {len(data)} bytes')
              except Exception as e: errors.append(f'{rel}: {type(e).__name__}: {e}')
          markers={
            'masters.html':['<h2>Anciens Masters</h2>','class="people-grid"'],
            'en/masters.html':["<h2>Former Master's students and interns</h2>",'class="people-grid"'],
            'cv.html':['Computational Methods in Water Resources, 2018–2024','co-organisateur'],
            'science-societe.html':['assets/maquette-nappes.jpg','assets/maquette-fractures.jpg'],
            'galerie-recherche.html':['rel="canonical" href="https://dreuzy.github.io/galerie-recherche.html"'],
            'en/research-figures.html':['rel="canonical" href="https://dreuzy.github.io/en/research-figures.html"']}
          for f,needles in markers.items():
              s=live.get(f,'')
              for n in needles:
                  if n not in s: errors.append(f'{f}: live marker missing {n}')
          print(f'LIVE pages OK={len(live)}/{len(files)}')
          if errors:
              print('LIVE ERRORS / PROPAGATION LAG:'); print('\n'.join(errors)); raise SystemExit(2)
          print('LIVE AUDIT PASS')
          PY
