name: Verify live PyAges software figure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-pyages-live.yml"
      - "logiciels.html"
      - "en/software.html"
      - "assets/pyages-software-figure.webp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployed PyAges software figure
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages and verify image
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            echo "Attempt $i/30"
            if curl -fsSL -H 'Cache-Control: no-cache' "https://dreuzy.github.io/assets/pyages-software-figure.webp?verify=${GITHUB_SHA}-${i}" -o /tmp/pyages-software.webp; then
              size=$(stat -c%s /tmp/pyages-software.webp)
              kind=$(file -b /tmp/pyages-software.webp)
              echo "size=$size"
              echo "type=$kind"
              if [ "$size" -gt "40000" ] && echo "$kind" | grep -qi 'Web/P image'; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Verify French and English page references
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'Cache-Control: no-cache' "https://dreuzy.github.io/logiciels.html?verify=${GITHUB_SHA}" -o /tmp/fr.html
          curl -fsSL -H 'Cache-Control: no-cache' "https://dreuzy.github.io/en/software.html?verify=${GITHUB_SHA}" -o /tmp/en.html
          grep -F 'src="assets/pyages-software-figure.webp"' /tmp/fr.html
          grep -F 'src="../assets/pyages-software-figure.webp"' /tmp/en.html
