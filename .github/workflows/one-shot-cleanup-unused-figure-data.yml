name: One-shot cleanup unused figure data
on:
  push:
    paths:
      - '.github/workflows/one-shot-cleanup-unused-figure-data.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-audit and remove only known unreferenced families
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          data=root/'assets'/'figure-data'
          groups={}
          for p in data.glob('*.part-*.txt'):
              m=re.match(r'(.+)\.part-(\d+)\.txt$', p.name)
              if m:
                  groups.setdefault(m.group(1),[]).append(p)

          html_names=set()
          html_counts={}
          for p in root.rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              for name,count in re.findall(r'data-b64-name=["\']([^"\']+)["\'][^>]*data-b64-parts=["\'](\d+)["\']', s):
                  html_names.add(name)
                  html_counts[name]=max(html_counts.get(name,0),int(count))

          code_names=set()
          exts={'.js','.py','.yml','.yaml','.json','.md'}
          skip='.github/workflows/one-shot-cleanup-unused-figure-data.yml'
          code_files=[p for p in root.rglob('*') if p.is_file() and p.suffix in exts and 'assets/figure-data' not in p.as_posix() and '.git' not in p.parts and p.as_posix()!=skip]
          for name in groups:
              patt=re.compile(r'(?<![A-Za-z0-9_-])'+re.escape(name)+r'(?![A-Za-z0-9_-])')
              for p in code_files:
                  try: s=p.read_text(encoding='utf-8')
                  except Exception: continue
                  if patt.search(s):
                      code_names.add(name); break

          active=html_names|code_names
          unused=set(groups)-active
          expected={
            'hydromodpy-approved','hydromodpy-approved-hq','hydromodpy-approved-original','hydromodpy-approved-site','hydromodpy-approved720',
            'hydromodpy-illustration','hydromodpy-new','hydromodpy-restored','lithology-conductivity-illustration','nirecas-illustration',
            'pyages-concept','pyages-correct','pyages-good','pyages-middle-v2','pyages-web'
          }
          print('Detected unused:', ', '.join(sorted(unused)))
          if unused != expected:
              raise SystemExit(f'Guard failed: detected unused set differs. Missing={sorted(expected-unused)} Extra={sorted(unused-expected)}')

          # Verify every HTML-requested dynamic figure has all expected sequential chunks before deleting anything.
          for name,count in sorted(html_counts.items()):
              for i in range(count):
                  p=data/f'{name}.part-{i:02d}.txt'
                  if not p.exists() or p.stat().st_size==0:
                      raise SystemExit(f'Active figure chunk missing before cleanup: {p}')
          for i in range(9):
              p=data/f'pyages-final-v2.part-{i:02d}.txt'
              if not p.exists() or p.stat().st_size==0:
                  raise SystemExit(f'PyAges build chunk missing before cleanup: {p}')

          total=0; files=0
          for name in sorted(expected):
              for p in groups[name]:
                  total += p.stat().st_size; files += 1; p.unlink()
          print(f'Removed {files} unreferenced chunk files, {total} bytes')
          PY
      - name: Validate site and active dynamic figures after deletion
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
          python - <<'PY'
          from pathlib import Path
          import re
          data=Path('assets/figure-data')
          requests={}
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              for name,count in re.findall(r'data-b64-name=["\']([^"\']+)["\'][^>]*data-b64-parts=["\'](\d+)["\']',s):
                  requests[name]=max(requests.get(name,0),int(count))
          for name,count in requests.items():
              for i in range(count):
                  p=data/f'{name}.part-{i:02d}.txt'
                  assert p.exists() and p.stat().st_size>0, p
          for i in range(9):
              p=data/f'pyages-final-v2.part-{i:02d}.txt'
              assert p.exists() and p.stat().st_size>0, p
          print('All active dynamic figure chunks remain complete')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/figure-data
          git diff --cached --quiet && exit 0
          git commit -m 'Remove unused intermediate figure data'
          git push
