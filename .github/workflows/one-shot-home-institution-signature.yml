name: One-shot home institutional signature
on:
  push:
    paths:
      - '.github/workflows/one-shot-home-institution-signature.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Add institutional signature to home pages
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          signature_fr = '<div class="institution-signature"><a href="https://www.ens-rennes.fr/">École normale supérieure de Rennes</a> <span aria-hidden="true">✜</span> <a href="https://www.univ-rennes.fr/">Université de Rennes</a></div>'
          signature_en = '<div class="institution-signature"><a href="https://www.ens-rennes.fr/">École normale supérieure de Rennes</a> <span aria-hidden="true">✜</span> <a href="https://www.univ-rennes.fr/">Université de Rennes</a></div>'

          # French home page
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<h1>Jean-Raynald de Dreuzy</h1><div class="home-role"><strong>Président</strong> · depuis 2026<br><strong><a href="https://www.ens-rennes.fr/">École normale supérieure de Rennes</a></strong></div>'
          new = '<h1>Jean-Raynald de Dreuzy</h1>' + signature_fr + '<div class="home-role"><strong>Président de l’École normale supérieure de Rennes</strong> · depuis 2026</div>'
          if s.count(old) != 1:
              raise SystemExit(f'FR guard failed: expected hero block once, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # English home page
          p = Path('en/index.html')
          s = p.read_text(encoding='utf-8')
          old = '      <h1>Jean-Raynald de Dreuzy</h1>\n      <div class="home-role"><strong>President</strong> · since 2026<br><strong><a href="https://www.ens-rennes.fr/">École normale supérieure de Rennes</a></strong></div>'
          new = '      <h1>Jean-Raynald de Dreuzy</h1>\n      ' + signature_en + '\n      <div class="home-role"><strong>President of École normale supérieure de Rennes</strong> · since 2026</div>'
          if s.count(old) != 1:
              raise SystemExit(f'EN guard failed: expected hero block once, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Styling: institutional signature stays visually secondary to the name and roles.
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          marker = '.home-role{font-size:1.08rem;color:#40525e;margin-bottom:.2rem}'
          rule = '.institution-signature{margin:-.15rem 0 .85rem;font-size:.94rem;line-height:1.45;color:#6b7c87;white-space:nowrap}.institution-signature a{color:var(--navy);text-decoration:none;font-weight:600}.institution-signature a:hover{text-decoration:underline}.institution-signature span{color:#8a9aa4;padding:0 .2rem}'
          if 'institution-signature{' in s:
              raise SystemExit('CSS guard failed: institution-signature already exists')
          if s.count(marker) != 1:
              raise SystemExit(f'CSS guard failed: home-role marker count={s.count(marker)}')
          s = s.replace(marker, rule + marker, 1)
          mobile = '@media(max-width:620px){'
          if mobile not in s:
              raise SystemExit('CSS guard failed: mobile breakpoint not found')
          s = s.replace(mobile, '@media(max-width:620px){.institution-signature{white-space:normal}', 1)
          p.write_text(s, encoding='utf-8')

          # Exact-content checks.
          for fn in ('index.html','en/index.html'):
              text = Path(fn).read_text(encoding='utf-8')
              exact = 'École normale supérieure de Rennes</a> <span aria-hidden="true">✜</span> <a href="https://www.univ-rennes.fr/">Université de Rennes</a>'
              if text.count(exact) != 1:
                  raise SystemExit(f'{fn}: exact signature count={text.count(exact)}')
          print('Institutional signature inserted on both home pages.')
          PY
      - name: Validate bilingual site
        run: |
          python scripts/check_bilingual_mirror.py
          python scripts/check_local_links.py
      - name: Commit home-page signature
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html styles.css
          git commit -m 'Add ENS Rennes and University of Rennes signature to home page'
          git push
