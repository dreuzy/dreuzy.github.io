name: One-shot CV and science society v2
on:
  push:
    paths:
      - '.github/workflows/one-shot-cv-science-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Update CV and Science society
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup, Tag
          from pathlib import Path
          import re

          def write(path, soup):
              Path(path).write_text(str(soup), encoding='utf-8')

          def section_by_h2(soup, title):
              for sec in soup.select('section.section-block'):
                  h2 = sec.find('h2')
                  if h2 and h2.get_text(' ', strip=True) == title:
                      return sec
              return None

          # ---------- CV ----------
          for path, lang in [('cv.html','fr'), ('en/cv.html','en')]:
              soup = BeautifulSoup(Path(path).read_text(encoding='utf-8'), 'html.parser')
              if lang == 'fr':
                  collab_title = 'Collaborations scientifiques antérieures — sélection'
                  editorial_title = 'Activités éditoriales antérieures'
                  supervision_title = 'Encadrement'
                  collab_html = '''<section class="section-block"><h2>Collaborations scientifiques antérieures — sélection</h2><p class="collab-list"><strong>Philippe Davy · Olivier Bour</strong> (Géosciences Rennes, Université de Rennes — réseaux de fractures, percolation et changement d’échelle), <strong>Brian Berkowitz</strong> (Department of Earth and Planetary Sciences, Weizmann Institute of Science, Israël — transport en milieux fracturés), <strong>Jocelyne Erhel · Géraldine Pichot</strong> (IRISA, Inria — méthodes numériques, calcul scientifique et réseaux de fractures), <strong>Anthony Beaudoin</strong> (Institut P′, CNRS / Université de Poitiers / ENSMA — dispersion et transport en milieux hétérogènes), <strong>Jesús Carrera · Marco Dentz</strong> (IDAEA-CSIC / Hydrogeology Group UPC-CSIC, Espagne — transport réactif, dispersion et temps de résidence), <strong>Timothy R. Ginn</strong> (Department of Civil and Environmental Engineering, Washington State University, États-Unis — âge de l’eau, temps de résidence et traceurs), <strong>Arash Massoudieh</strong> (Department of Civil and Environmental Engineering, The Catholic University of America, États-Unis — inversion bayésienne des traceurs et âges des eaux souterraines), <strong>Daniel M. Tartakovsky</strong> (Department of Energy Science and Engineering, Stanford University, États-Unis — transport fracture–matrice et transport anormal).</p></section>'''
                  editorial_html = '''<section class="section-block"><h2>Activités éditoriales antérieures</h2><p><strong>Hydrogeology Journal</strong> — éditeur associé à partir de 2006 ; activité aujourd’hui terminée.</p><p><strong>Journal of Hydrology</strong> — éditeur associé pendant quelques années ; activité aujourd’hui terminée.</p><p><strong>Journal of Hydrology, 2016</strong> — co-éditeur, avec Timothy R. Ginn, du numéro spécial <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p></section>'''
              else:
                  collab_title = 'Past scientific collaborations — selected'
                  editorial_title = 'Past editorial activities'
                  supervision_title = 'Supervision'
                  collab_html = '''<section class="section-block"><h2>Past scientific collaborations — selected</h2><p class="collab-list"><strong>Philippe Davy · Olivier Bour</strong> (Géosciences Rennes, University of Rennes — fracture networks, percolation and upscaling), <strong>Brian Berkowitz</strong> (Department of Earth and Planetary Sciences, Weizmann Institute of Science, Israel — transport in fractured media), <strong>Jocelyne Erhel · Géraldine Pichot</strong> (IRISA, Inria — numerical methods, scientific computing and fracture-network models), <strong>Anthony Beaudoin</strong> (Institut P′, CNRS / University of Poitiers / ENSMA — dispersion and transport in heterogeneous media), <strong>Jesús Carrera · Marco Dentz</strong> (IDAEA-CSIC / Hydrogeology Group UPC-CSIC, Spain — reactive transport, dispersion and residence times), <strong>Timothy R. Ginn</strong> (Department of Civil and Environmental Engineering, Washington State University, United States — groundwater age, residence times and tracers), <strong>Arash Massoudieh</strong> (Department of Civil and Environmental Engineering, The Catholic University of America, United States — Bayesian tracer inversion and groundwater ages), <strong>Daniel M. Tartakovsky</strong> (Department of Energy Science and Engineering, Stanford University, United States — fracture–matrix and anomalous transport).</p></section>'''
                  editorial_html = '''<section class="section-block"><h2>Past editorial activities</h2><p><strong>Hydrogeology Journal</strong> — Associate Editor from 2006; role now completed.</p><p><strong>Journal of Hydrology</strong> — Associate Editor for several years; role now completed.</p><p><strong>Journal of Hydrology, 2016</strong> — co-editor, with Timothy R. Ginn, of the special issue <em>Residence times in subsurface hydrological systems: signature of hydrological processes and impact on environmental applications</em>.</p></section>'''

              old_collab = section_by_h2(soup, collab_title)
              old_editorial = section_by_h2(soup, editorial_title)
              supervision = section_by_h2(soup, supervision_title)
              if not (old_collab and old_editorial and supervision):
                  raise SystemExit(f'CV sections missing in {path}')
              old_collab.decompose(); old_editorial.decompose()
              new_editorial = BeautifulSoup(editorial_html, 'html.parser').section
              new_collab = BeautifulSoup(collab_html, 'html.parser').section
              supervision.insert_before(new_editorial)
              supervision.insert_before(new_collab)
              write(path, soup)

          # ---------- Science & society ----------
          def extract_years(text):
              return [int(y) for y in re.findall(r'(?<!\d)(20\d{2})(?!\d)', text)]

          def rebuild_science(path, lang):
              soup = BeautifulSoup(Path(path).read_text(encoding='utf-8'), 'html.parser')
              main = soup.find('main')
              if not main: raise SystemExit(f'No main in {path}')
              secs = main.select('section.section-block')
              if len(secs) < 4: raise SystemExit(f'Expected 4 sections in {path}, got {len(secs)}')

              if lang == 'fr':
                  titles = {
                      'media':'Médias, articles et ouvrages',
                      'talks':'Conférences, webinaires, débats et expertise publique',
                      'outreach':'Médiation scientifique et ressources pédagogiques',
                      'territories':'Recherche, territoires et aide à la décision',
                  }
                  recent_label='Activités récentes'; earlier_label='Activités antérieures'
              else:
                  titles = {
                      'media':'Media, articles and books',
                      'talks':'Public talks, webinars, debates and public expertise',
                      'outreach':'Science outreach and educational resources',
                      'territories':'Research, territories and decision support',
                  }
                  recent_label='Recent activities'; earlier_label='Earlier activities'

              found = {}
              for sec in secs:
                  h2 = sec.find('h2')
                  if not h2: continue
                  txt = h2.get_text(' ', strip=True)
                  for key, title in titles.items():
                      if txt == title:
                          found[key] = sec
              if set(found) != set(titles):
                  raise SystemExit(f'Missing science sections in {path}: {set(titles)-set(found)}')

              recent_groups = []
              earlier_groups = []

              for key in ['media','talks','territories']:
                  sec = found[key]
                  recent_items=[]; earlier_items=[]
                  for child in list(sec.children):
                      if not isinstance(child, Tag) or child.name in {'h2','h3'}:
                          continue
                      if 'pub-entry' not in (child.get('class') or []):
                          continue
                      meta = child.select_one('.meta-line')
                      text = meta.get_text(' ', strip=True) if meta else ''
                      years = extract_years(text)
                      if not years:
                          is_recent = key == 'media'
                      else:
                          is_recent = max(years) >= 2021
                      (recent_items if is_recent else earlier_items).append(str(child))
                  if recent_items: recent_groups.append((titles[key], recent_items))
                  if earlier_items: earlier_groups.append((titles[key], earlier_items))

              # Outreach is entirely historical and includes figures/resources in addition to entries.
              outreach_children=[]
              for child in list(found['outreach'].children):
                  if not isinstance(child, Tag) or child.name in {'h2','h3'}:
                      continue
                  outreach_children.append(str(child))
              earlier_groups.insert(2, (titles['outreach'], outreach_children))

              # Remove original thematic sections.
              anchor = found['media']
              for sec in found.values():
                  sec.extract()

              def make_period(label, ident, groups):
                  sec = soup.new_tag('section', attrs={'class':'section-block period-block', 'id':ident})
                  h2 = soup.new_tag('h2'); h2.string = label; sec.append(h2)
                  for title, html_items in groups:
                      h3 = soup.new_tag('h3'); h3.string = title; sec.append(h3)
                      for html in html_items:
                          frag = BeautifulSoup(html, 'html.parser')
                          tag = next((x for x in frag.contents if isinstance(x, Tag)), None)
                          if tag: sec.append(tag)
                  return sec

              recent_sec = make_period(recent_label, 'recent-activities', recent_groups)
              earlier_sec = make_period(earlier_label, 'earlier-activities', earlier_groups)
              main.append(recent_sec); main.append(earlier_sec)

              # Add a visible but restrained period navigation under the page title.
              h1 = main.find('h1')
              if h1:
                  old_jump = main.select_one('.period-jump')
                  if old_jump: old_jump.decompose()
                  p = soup.new_tag('p', attrs={'class':'period-jump'})
                  a1 = soup.new_tag('a', href='#recent-activities'); a1.string = recent_label
                  a2 = soup.new_tag('a', href='#earlier-activities'); a2.string = earlier_label
                  p.append(a1); p.append(' · '); p.append(a2)
                  h1.insert_after(p)

              # Stronger visual separation than the previous h3-only version.
              style = soup.find('style')
              css = '.period-jump{margin:.2rem 0 2rem;font-size:1rem}.period-block{margin-top:2.2rem}.period-block>h2{font-size:1.85rem;margin-bottom:1.4rem}.period-block>h3{font-size:1.18rem;margin:1.8rem 0 .85rem;padding-bottom:.35rem;border-bottom:1px solid var(--line)}#earlier-activities{margin-top:3.2rem;padding-top:2rem;border-top:3px solid var(--line)}'
              if style and '.period-block' not in style.get_text():
                  style.append(css)
              elif not style:
                  style = soup.new_tag('style'); style.string=css; soup.head.append(style)
              write(path, soup)

          rebuild_science('science-societe.html','fr')
          rebuild_science('en/science-society.html','en')
          PY
      - name: Validate bilingual mirror
        run: python scripts/check_bilingual_mirror.py
      - name: Validate local links
        run: python scripts/check_local_links.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv.html en/cv.html science-societe.html en/science-society.html
          git commit -m 'Refine past collaborations and science society chronology'
          git push
